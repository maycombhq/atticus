covers: [serves, calls, stores, deploys]
notes: >-
  eShopOnWeb: a monolith with two hosts. src/Web is ASP.NET Core MVC + Razor Pages (and hosts the Blazor
  WebAssembly admin, src/BlazorAdmin, inside its /Admin page); src/PublicApi is a minimal-API host using
  MinimalApi.Endpoint classes (app.MapGet etc. inside each endpoint's AddRoute) plus one Ardalis
  ApiEndpoints controller (POST api/authenticate). Web controllers use attribute routes
  [controller]/[action]; Program.cs adds RouteTokenTransformerConvention(SlugifyParameterTransformer),
  which lower-cases and hyphenates those tokens, so Manage/MyAccount is served at /manage/my-account
  (literal route text, like "Logout" on UserController, is not transformed). Razor Pages are listed by
  file path (Index pages at their folder; the Identity area pages under /Identity/Account), one entry per
  handler: OnGet as GET, OnPost as POST, and the named handler OnPostUpdate on Basket/Index, whose
  @page "{handler?}" template puts it at POST /Basket/Update. Pages with no handler method (Admin/Index)
  are listed as GET at their @page line. The health checks (UseHealthChecks("/health") and the two
  MapHealthChecks paths) accept any method, so they have no method key. Left out of serves: the PublicApi
  Swagger JSON/UI, the Web's MapFallbackToFile("index.html") and its unused conventional route (every
  controller is attribute-routed), dev-only middleware (migrations end point, WASM debugging), and the
  BlazorAdmin client-side @page routes (/admin, /logout), which are routed in the browser inside the
  Web's /Admin page. An optional CatalogBaseUrl setting can set a PathBase on the Web; it is unset in the
  committed appsettings, so no prefix is applied. Calls: the BlazorAdmin services call PublicApi through
  HttpService and CatalogLookupDataService with ApiBase from BlazorAdmin/wwwroot/appsettings.json
  (https://localhost:5099/api/), so paths start /api/; HttpDelete appends /{id}; the lookup endpoint names
  come from [Endpoint(Name = ...)] on BlazorShared CatalogBrand and CatalogType, both resolved at the one
  GetFromJsonAsync line. CustomAuthStateProvider and Logout.razor call the Web host's own UserController
  (HttpClient BaseAddress = the host's base address) at "User" and "User/Logout", written as requested.
  The Web's ApiHealthCheck calls GET {ApiBase}catalog-items on PublicApi. Each endpoint is listed once per
  caller at its first call site (CatalogItemService has two GET catalog-items list calls; the one at line
  65 is listed). HomePageHealthCheck's GET to the Web's own home page is a self-call and left out. Stores:
  two EF Core contexts, CatalogContext and AppIdentityDbContext, with committed migrations; tables are
  cited at the CreateTable name in the initial migrations (CatalogItem maps to Catalog via ToTable; the
  later FixBuyerId and FixShipToAddress migrations create no tables). The three HiLo sequences
  (catalog_hilo, catalog_brand_hilo, catalog_type_hilo) are sequences, not tables, and are left out.
  Deploys: azure.yaml has one service, web, with host appservice, and infra/main.bicep creates it with
  core/host/appservice.bicep (Microsoft.Web/sites) plus two Azure SQL databases; PublicApi is not in the
  azd deployment. docker-compose.yml runs Web, PublicApi and SQL Server for local development and is not
  counted as a deployment; the GitHub workflows only build and test.
