# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: eshop
commit: 913acea66708a59595351174cee9b29f37179d29
covers: [serves, calls, stores, deploys]
notes: >-
  Services (named as in src/eShop.AppHost/AppHost.cs): identity-api (Duende IdentityServer plus MVC
  controllers), basket-api (gRPC, Redis), catalog-api, ordering-api, order-processor, payment-processor,
  webhooks-api, the webapp (Blazor server), the webhooksclient (Blazor), and a YARP mobile-bff declared in
  the AppHost. ClientApp (MAUI) and HybridApp (MAUI Blazor) are client apps: they serve nothing, but their
  outbound calls are listed. Paths are what a client calls: the MapGroup prefix plus the route, with route
  constraints and optional markers stripped ({id:int} -> {id}, {brandId?} -> {brandId}). Versioning is
  Asp.Versioning with the default query-string reader (?api-version=1.0 / 2.0), so it never appears in the
  path. Catalog has v1-only, v2-only and shared routes; GET /api/catalog/items is declared once per version
  and both declarations are listed. Ordering and Webhooks are v1 only. Identity.API uses
  MapDefaultControllerRoute ({controller=Home}/{action=Index}/{id?}); each action is listed once as
  /Controller/Action, Index actions as /Controller and Home/Index as /; actions with no [Http*] attribute
  (Home/Index, Home/Error, Diagnostics/Index) accept any method and are written as GET. Duende
  IdentityServer's built-in protocol endpoints (/connect/*, /.well-known/*) come from the library and are
  left out. Blazor @page routes in WebApp and WebhookClient are listed as GET (HybridApp pages run inside the
  MAUI app, not over HTTP, so they are left out). Left out of serves: the dev-only /health and /alive
  endpoints and OpenAPI/Scalar routes from eShop.ServiceDefaults (shared by every service, only in
  Development or when OpenApi config exists), and the 14 YARP mobile-bff routes in
  src/eShop.AppHost/Extensions.cs:88-153, which match any method and only forward to the catalog, ordering
  and identity routes already listed. Calls: the WebApp's typed HttpClients (catalog-api with api-version
  2.0, ordering-api with 1.0), its gRPC Basket client and its MapForwarder for product images; the
  WebhookClient's client for webhooks-api; HybridApp and ClientApp REST calls go to mobile-bff (which
  forwards /api/catalog and /api/orders unchanged), and ClientApp's gRPC basket calls go straight to
  basket-api (port 5221). Catalog paths written by clients in camel case (catalogBrands) are written as
  the server declares them (routing is case-insensitive). Left out of calls: Webhooks.API's POST to each
  subscriber's DestUrl and OPTIONS to its grant URL (the URLs are runtime data), OIDC calls to identity-api
  made by libraries (OpenIdConnect, IdentityModel.OidcClient), and AI provider calls (OpenAI/Ollama/Foundry)
  from Catalog.API and WebApp. Published events are cited at the line that creates the event (each is then
  saved to the outbox or published on the next line or two). Stores: tables are the ToTable names from the
  entity configurations; ordering tables live in the "ordering" schema (HasDefaultSchema). Webhooks has no
  ToTable, so EF uses the DbSet property name (Subscriptions, confirmed by its migration). Identity uses
  ASP.NET Core Identity's default AspNet* tables, cited at the Identity migration since the names come from
  the library. IntegrationEventLog is declared once in IntegrationEventLogEF and used by both catalog and
  ordering databases. The old orderstatus table was dropped by a migration and is not in the model. Basket
  stores baskets in Redis (keys, not tables), so nothing is listed for it. Deploys: the AppHost calls
  AddAzureContainerAppEnvironment, which makes Azure Container Apps the publish target for every project
  (aspire deploy / azd); there is no azure.yaml, bicep or Dockerfile. build/acr-build/queue-all.ps1 points
  at paths from the older eShopOnContainers layout that don't exist here, so it isn't counted.
