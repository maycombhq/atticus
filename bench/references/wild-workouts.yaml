covers: [serves, calls, stores, deploys]
notes: >-
  Three Dots Labs' Wild Workouts: Go services trainer, trainings and users (internal/), each binary
  started as an HTTP server (chi, handlers generated by oapi-codegen from api/openapi/*.yml) or, for
  trainer and users, as a gRPC server (SERVER_TO_RUN), plus a Vue front end (web/) on Firebase
  Hosting. Serves: internal/common/server/http.go mounts every service's generated handler at /api
  (rootRouter.Mount("/api", ...)), so the paths are /api plus the spec's paths; each is cited at its
  path line in the OpenAPI spec (generated code is not cited; GET and POST /api/trainings share the
  line). gRPC: trainer.TrainerService (4 methods) and users.UsersService (2), from the proto
  packages trainer and users, cited at the implementing method. Calls: the trainings service's gRPC
  clients (internal/trainings/adapters) call trainer ScheduleTraining and CancelTraining and users
  UpdateTrainingBalance (trainer's IsHourAvailable and MakeHourAvailable are served but only tests
  call them); the users HTTP server's loadFixtures goroutine, which runs at every start, calls
  users.UsersService GetTrainingBalance and UpdateTrainingBalance on the users gRPC server (the
  second is already listed). The front end calls the three HTTP APIs through generated clients in
  web/src/repositories/clients (generated code); each call is cited at its call site in
  web/src/repositories/trainings.js and user.js and resolved to the method and path the generated
  method uses, with the base https://{hostname}/api (the spec's server URL, set from
  window.location.hostname; localhost ports in development), so the paths are the same /api paths
  the services serve. GET /api/users/current is called twice and listed at its first site. The
  internal/common/client Go HTTP clients are used only by tests. web/firebase.json's Hosting
  rewrites (/api/trainer, /api/trainings and /api/users to the Cloud Run services trainer-http,
  trainings-http and users-http) are the hosting platform's routing, like an ingress, not an
  application gateway, so they are neither entries nor calls; the `to` of each front-end call is the
  service the rewrite sends it to. Left out of calls: Firebase Auth (token verification and the
  fixtures' user creation through the Firebase Admin SDK; the front end's sign-in through the
  Firebase JS SDK) and Firestore itself. Stores: three Firestore collections, trainer-hours
  (trainer; the dates and hour repositories both name it, cited once), trainings and users. The
  MySQL hours table (sql/schema.sql) belongs to an alternative hour repository that only tests
  construct (service/application.go wires Firestore), so it is ignored, neither found nor wrong.
  Deploys: Cloud Run for the five service processes (terraform/service/service.tf
  google_cloud_run_service, named <service>-<protocol>, and the deploy workflow's task deploy), and
  Firebase Hosting for the front end (web/firebase.json, deployed by firebase-tools in the same
  workflow). docker-compose.yml is local development and tools/c4 a diagram generator.
