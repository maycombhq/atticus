# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: eshop-modernizing
commit: 63bc9ec4414d7e281dc9f9d7bdcf70030950457d
covers: [serves, calls, stores, deploys]
notes: >-
  Covered seven app folders, each counted once as its own deployable: eShopLegacyMVCSolution/src/eShopLegacyMVC (ASP.NET MVC 5 + Web API 2),
  eShopLegacyMVCSolution/eShopPorted (ASP.NET Core 2.2 port, in the same solution), eShopLegacyWebFormsSolution/src/eShopLegacyWebForms,
  eShopModernizedMVCSolution/src/eShopModernizedMVC, eShopModernizedWebFormsSolution/src/eShopModernizedWebForms, and the WCF service plus
  WinForms client in both eShopLegacyNTier/src and eShopModernizedNTier/src. Identical paths in different apps are listed once per app.
  MVC routing: the conventional route {controller}/{action}/{id} with defaults Catalog/Index (RouteConfig.cs) gives /Catalog/<Action>/{id};
  Catalog.Index is written as "/" (the URL MVC generates for the defaults; /Catalog and /Catalog/Index reach it too). Actions with no verb
  attribute are written GET; [HttpPost] overloads are POST on the same path (Html.BeginForm posts back to the current URL), and
  DeleteConfirmed is POST /Catalog/Delete/{id} via [ActionName("Delete")]. Attribute routes ([Route]) use the attribute's line; all other
  actions use the method's line. Web API in the legacy MVC app uses api/{controller}/{id} from WebApiConfig.cs. eShopPorted
  BrandsController.Index and FilesController.Index have no verb attribute under [Route("api/[controller]")], so they answer any verb; written GET.
  The modernized MVC AccountController actions (SignIn, SignOut, EndSession) have no verb attribute; written GET.
  Left out: legacy MVC Controllers/Api/CatalogController.cs declares class CatalogController2 with [Route("api")], but MVC only discovers
  types whose name ends in "Controller", so it is never routed. /Pics/* in the modernized MVC app is static files (IgnoreRoute).
  WebForms: each .aspx page is GET "/<file>.aspx" at its Page directive (line 1), plus one GET entry per MapPageRoute friendly URL at the
  RouteConfig.cs url line. Postbacks (button click handlers posting the page to itself) are not listed as separate POST endpoints. The
  IIS default document (Default.aspx at "/") is server config, not code, so "/" is not listed for WebForms. The modernized WebForms
  ScriptService PicUploader.asmx is POST /Catalog/PicUploader.asmx/UploadImage (called by Scripts/site.js as JSON), at its [WebMethod].
  Master pages and .ascx controls are not endpoints. WCF: ICatalogService (basicHttpBinding at CatalogService.svc) has 10 operations,
  listed per NTier folder at each [OperationContract]; the mex metadata endpoint is not listed.
  Calls: each WinForms client calls ICatalogService through the generated eShopServiceReference.CatalogServiceClient; one entry per operation
  at its first call site in eShopWinForms/Controllers/CatalogController.cs (GetDiscount is also called at line 80, GetCatalogItems at line 90).
  The eShopWCFService/CatalogServiceClient.cs file is not compiled (absent from the csproj) and is ignored. Browser JavaScript calling its
  own app (site.js) is not an inter-app call. The modernized MVC and WebForms apps use the Azure Storage SDK (ImageAzureStorage.cs) and Azure AD
  OpenID Connect (Startup.Auth.cs); these are SDK/middleware calls with no declared path and are left out of calls.
  Stores: tables per app. MVC, WebForms and eShopPorted map CatalogItem to Catalog, plus CatalogBrand and CatalogType, via ToTable. The WCF
  EntityModel has no ToTable, so EF6's pluralizing convention names CatalogBrands, CatalogItems, CatalogTypes and DiscountItems (at the DbSet
  line); CatalogItemsStock comes from [Table]. The hilo SQL sequences (dbo.catalog_hilo etc.) are sequences, not tables, and are left out; the
  Setup/*.csv files are seed data for the same tables. eShopPorted's EF Core migration (Migrations/20201130044339_Initial.cs) creates the same three tables.
  Deploys: one entry per platform. kubernetes = Kubernetes/ and Kubernetes-DockerForWindows/ manifests (MVC, WebForms, WCF, SQL, RabbitMQ);
  service-fabric = ServiceFabric/*/ApplicationPackageRoot manifests (MVC, WebForms, SQL container apps); azure-arm = ACI/aci.json, an ARM
  template for Azure Container Instances (the ServiceFabric-ARM-Templates-Scripts cluster templates are also ARM); docker-compose = the root
  docker-compose.yml, which runs the three modernized apps plus SQL Server as Windows containers on the nat network (the per-solution and
  VM/ compose files are the same idea per app). Dockerfiles are build inputs, not counted.
