notes: >-
  Spring Cloud microservices: a Spring Cloud Gateway (WebFlux) api-gateway, customers-, vets- and
  visits-service (Spring MVC + JPA), a genai-service (Spring AI chat bot), plus config server,
  Eureka discovery server and Spring Boot Admin. The UI served by the gateway's static folder is
  not AngularJS at this commit: it is a Vue 3 app (ES modules, vue and vue-router from webjars via
  an import map) that calls the back end with fetch through scripts/api/client.js request().
  The gateway's own route paths (spring.cloud.gateway routes in api-gateway application.yml) are
  recorded as serves of the gateway with the Path predicate as written ("/api/vet/**" etc.) and no
  method, since a route accepts every method; StripPrefix=2 forwards /api/customer/owners to
  customers-service /owners. The proxying itself is not recorded as calls. No service sets a
  context path in this repo (service config lives in the external spring-petclinic-microservices-config
  repo, which is not part of this reference), so service paths are the controller mappings. Paths
  keep the literal "*" segment where the mapping uses one (owners/*/pets/{petId}). FallbackController
  /fallback accepts GET and POST, so it is two entries at the same line. Framework endpoints
  (actuator, Eureka, config server, Spring Boot Admin, chaos monkey) are left out. Calls: the
  gateway's WebClient clients (base http://customers-service and http://visits-service, load-balanced
  through Eureka); the genai-service's RestClient calls to customers-service (base URI from the
  DiscoveryClient) and its WebClient call to vets-service /vets (only made when vectorstore.json is
  absent); and the Vue UI's fetch calls, written as the path the browser requests, with to: the
  service the gateway route forwards to (api-gateway for its own /api/gateway controller). JS
  template params are written as {name}. PetFormPage line 61 sends PUT .../pets/{petId} when editing
  and POST .../pets when adding, so it is two entries at that line. The genai-service's calls to
  OpenAI / Azure OpenAI go through Spring AI's ChatClient and model starter with no path in the repo,
  so they are not counted. No messaging. Stores are the hsqldb schema.sql tables of each service
  (the mysql schemas define the same tables; JPA @Table names match). Deployment: docker-compose.yml
  runs every service of the system from its published image (with memory limits), not just local
  dependencies, and there is no other deployment target, so it is counted as docker; the README
  frames it as starting the system locally, which makes this a judgement call.
