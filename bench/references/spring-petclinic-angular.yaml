# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: spring-petclinic-angular
commit: 7c9f1ab259f0dbc8a987c4e21d97dc616607b362
covers: [calls]
notes: >-
  An Angular single-page front end for the spring-petclinic-rest API. Every HTTP call is in the six
  services under src/app (owners, pets, pettypes, specialties, vets, visits) and goes to the base
  URL REST_API_URL = http://localhost:9966/petclinic/api/ (src/environments/environment.ts:26; the
  production file environment.prod.ts:25 has the same value), so every path starts /petclinic/api/.
  Each line points at the HttpClient get/post/put/delete call. searchOwners (owner.service.ts:83)
  calls GET /petclinic/api/owners with an optional ?lastName= query, so it is listed as its own call
  with the same method and path as getOwners; the query string is left out of the path. Adding a pet
  and adding a visit post to nested owner URLs, not to /pets or /visits. Pages (serves) are not
  covered. Deploys are not covered: the repo has a Dockerfile (nginx image) and a GitHub Actions CI
  workflow but no k8s manifest, Helm chart or cloud config. docs/ is generated Compodoc output and
  was ignored, as were tests and e2e.
