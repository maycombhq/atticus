covers: [serves, calls, stores]
notes: >-
  The RealWorld (Conduit) back end in NestJS with TypeORM on MySQL (ormconfig.json.example,
  synchronize on, so the entities are the schema). src/main.ts:8 sets the global prefix 'api', so
  every controller path is /api/<controller prefix>/<method path>; :param segments are written as
  {param}. The Swagger UI that SwaggerModule.setup mounts at /docs is a library-generated page and
  is left out. The committed dist/ folder is compiled output and is ignored. At this commit there
  is no Prisma schema (prisma/ holds only a .env), so stores come from TypeORM alone. Table names
  come from @Entity('name') where given; Comment has a bare @Entity(), so TypeORM's default naming
  makes it comment; the @JoinTable() on UserEntity.favorites gets the default join table name
  user_favorites_article (owning table user, property favorites, target table article). It calls
  no other service. No deployment files exist, so deploys is not covered.
