covers: [serves, calls, stores, deploys, fields, config]
notes: >-
  An azd template: an ASP.NET Core minimal API (src/api) and a React/Vite UI (src/web). The API maps
  every route on MapGroup("/lists") in src/api/Program.cs:49, so each path is /lists plus the route in
  TodoEndpointsExtensions.cs. Left out of serves: the Swagger UI (UseSwaggerUI with RoutePrefix "") and the
  static wwwroot/openapi.yaml, which are documentation, not API routes. Calls are the web UI's calls to its
  own API: the base URL is VITE_API_BASE_URL (set by azd from the API_BASE_URL Bicep output, either the
  App Service or the optional API Management front), defaulting to http://localhost:3100 in
  src/web/src/config/index.ts. The services are axios instances with baseURL = base + '/lists' or
  '/lists/{listId}/items', and get/delete/put append the id. save() sends POST without an id and PUT with
  one, so both are listed at the save call. RestService.patch is never called, so no PATCH is listed. Ids
  are written with the server's parameter names ({listId}, {itemId}). Application Insights telemetry from
  the UI and API is left out (analytics). The API also reads Key Vault through the Azure SDK at start-up
  (configuration, not a service call), left out. Stores: EF Core TodoDb with EnsureCreated and no table
  mapping, so table names follow the DbSet property names (Items, Lists) in Azure SQL. Deploys: azure.yaml
  hosts both services on appservice and infra/main.bicep creates two App Service sites (avm web/site) on a
  Linux plan; the GitHub and Azure DevOps pipelines just run azd provision/deploy, so one
  azure-app-service entry.
  Fields and config (ADR 0124 section 6, added 2026-10-24): request fields are the
  CreateUpdateTodoList and CreateUpdateTodoItem records (TodoEndpointsExtensions.cs:160 and :161)
  and the skip and batchSize query parameters; response fields are the TodoList and TodoItem
  properties each success response serialises (camelCase); columns are the EF columns of Items and
  Lists, which follow the entity properties (EnsureCreated, no mapping). TodoItem.List, a
  navigation property always serialised as null, is ignored. The web UI's calls carry the same
  bodies; fields of calls are not judged here. Config is the keys naming another system: the Key
  Vault endpoint, the key naming the Key Vault secret that holds the SQL connection string and that
  secret, and the UI's API base URL and Application Insights connection string. Logging,
  AllowedHosts, App Service build settings and azd outputs are ignored.
