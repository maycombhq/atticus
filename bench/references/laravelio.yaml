covers: [serves, calls, stores, deploys]
notes: >-
  Laravel.io, the Laravel community portal: a Laravel 11 app (Blade, Livewire, a Filament admin
  panel, Eloquent on MySQL, Sanctum API tokens, Scout with Algolia). Serves: routes/web.php (no
  prefix) and routes/api.php, which bootstrap/app.php's withRouting loads under Laravel's default
  "api" prefix, so the API routes are /api/articles... . Route::prefix('forum'), prefix('articles')
  and prefix('admin') groups add their prefix; optional parameters ({paste?}, {username?}) are
  written as {paste} and {username}. Route::view pages are GET entries.
  Route::redirect('/dashboard', '/user') registers the redirect for any method, so it has no method
  key. Route::feeds() (spatie/laravel-feed) serves the two feeds config/feed.php declares with the
  app's own items, GET /forum/feed and GET /articles/feed, cited at their url keys. The Filament
  panel (app/Providers/Filament/AdminPanelProvider.php, path admin) serves its Dashboard page at GET
  /admin and one list page per resource at GET /admin/<slug>, the slug being the model name in kebab
  case and plural (articles, replies, threads, users), cited at each resource's getPages route('/').
  Left out as framework or library endpoints: the /up health route (withRouting health), Filament's
  own login page (->login()), Livewire's /livewire/* endpoints, Sanctum's /sanctum/csrf-cookie, and
  spatie/laravel-login-link's local-only route. Calls: four Http facade calls with literal URLs:
  Unsplash GET /photos/{id} (SyncArticleImage job; its follow-up GET to the download_location the
  response returns is a runtime URL and left out), Fathom Analytics GET /v1/aggregations (the
  UpdateArticleViewCounts console command; a call made from a scheduled command is still a call),
  and GitHub GET /user/{id} on api.github.com and GET /u/{id} on avatars.githubusercontent.com
  (App\Social\GithubUserApi). Left out of calls: Socialite's GitHub OAuth requests (library
  mechanics), the Bluesky and Telegram notification channels and Algolia through Scout (SDK and
  channel libraries with no path in the repo), mail (SMTP, Resend), Nightwatch, and the embed/embed
  oEmbed fetches of URLs users paste (runtime URLs). Stores: the app's tables, cited at their CREATE
  TABLE in database/schema/mysql-schema.sql (the squashed schema; the eleven later migrations only
  add columns and indexes, except the queue and cache tables below): the models' tables (articles,
  replies, threads, users, likes, subscriptions, tags), the pivot tables their relations name
  (blocked_users on User::blockedUsers, spam_reports on the morphToMany spam relations of Thread and
  Reply, taggables for the taggable morph relation), and two framework-defined tables the app's own
  code reads and writes: notifications (the database channel of three notifications, read by the
  notifications page) and personal_access_tokens (Sanctum tokens created and deleted by the
  CreateApiToken and DeleteApiToken jobs). Framework bookkeeping tables are ignored (neither found
  nor wrong): migrations, failed_jobs, jobs, job_batches, cache, cache_locks, sessions (the session
  and cache drivers are file in .env.example), password_resets (the password broker's table, named
  by AUTH_PASSWORD_RESET_TOKEN_TABLE) and spatie/laravel-schedule-monitor's
  monitored_scheduled_tasks and monitored_scheduled_task_log_items. Deploys: Laravel Forge
  provisions and deploys the servers: herd.yml names the Forge site, the README credits Forge and
  Envoyer, and the tests workflow's deploy job posts to the deploy hook; recorded as laravel-forge.
  There is no container or cloud platform config.
