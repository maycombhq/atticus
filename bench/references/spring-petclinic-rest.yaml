# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: spring-petclinic-rest
commit: afc8fc1d3b8ec8de69414482b3bd70a1da78cb95
covers: [serves, calls, stores, deploys]
notes: >-
  A Spring Boot REST API (no UI) for the petclinic domain. Endpoints are declared in
  src/main/resources/openapi.yml; the OpenAPI generator turns that into interfaces (generated
  code, not cited) that the controllers in rest/controller/v1 and v2 implement under a class-level
  @RequestMapping("/api"). Each endpoint cites the operation line in openapi.yml. Every path
  includes server.servlet.context-path=/petclinic/ (application.properties:25), so the full path is
  /petclinic/api/... . /oops is in the spec but no controller implements its interface, so it isn't
  served and is left out. RootRestControllerV1 maps "/" for any HTTP method (no method key) and
  redirects to Swagger UI. It calls no other service. Tables come from the H2 schema (the HSQLDB,
  MySQL and Postgres schemas define the same tables). Deploys is empty:
  docker-compose.yml only starts local MySQL/Postgres, and the GitHub workflow only builds and
  pushes an image to Docker Hub with Jib; no Kubernetes, Helm or cloud platform config exists.
