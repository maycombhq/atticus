covers: [serves, calls, stores, deploys]
notes: >-
  CodeTriage: a server-rendered Ruby on Rails app (Slim views, ActiveRecord on Postgres, Sidekiq
  jobs) that subscribes users to GitHub repos and mails them issues and undocumented methods.
  Serves: every route in config/routes.rb, cited at its line, with Rails' optional "(.:format)"
  suffix dropped and :param written as {param}. A resources line gives one entry per action its
  only: list keeps, at the standard REST paths (show GET /x/{id}, index GET /x, new GET /x/new,
  create POST /x, edit GET /x/{id}/edit, destroy DELETE /x/{id}); update answers both PATCH and PUT,
  so it is two entries at the same line. resources :repos lists :index, but ReposController has no
  index action and there is no repos/index view, so GET /repos raises and is left out (a declared
  route nothing implements, like petclinic-rest's /oops). The scope "*full_name" (a glob matching
  "owner/name", slash included) is written as /{full_name}, so repos#show is GET /{full_name} and
  the badge route is GET /{full_name}/badges/{badge_type}. The two redirect routes the app declares
  (GET /sitemap.xml.gz to the S3 sitemap, GET /mail_view to rails/mailers) are entries. Left out as
  framework or library endpoints: Devise's own session and password routes (devise_for :users with
  database_authenticatable and recoverable: /users/sign_in, /users/sign_out, /users/password...),
  the OmniAuth request phase /users/auth/github, the Sidekiq::Web UI mounted at /sidekiq for admins,
  and Rails' mailer previews at /rails/mailers. The OmniAuth callback /users/auth/github/callback is
  kept, because the app's own Users::OmniauthCallbacksController#github handles it (devise_for's
  controllers: option, routes.rb:22); Devise routes it for GET and POST, so it has no method key.
  Calls: the GitHub REST API (api.github.com, the GitHubBub gem's base), made through the
  GithubFetcher resources in app/models/github_fetcher, each of which sets its @api_path with
  File.join (cited at the line naming its last literal segment), plus RepoLabelAssigner's labels
  request (used by a rake task in lib/tasks/schedule.rake; a call made from a scheduled task is
  still a call). Paths are written with a leading slash and their File.join parts as {param}; query
  options (sort, state, page, per_page) are not part of the path. GithubFetcher::Repos makes three
  calls, /user/repos, /user/starred and /user/subscriptions, one per KINDS constant (cited at each
  constant). GithubFetcher::User's GET /user is left out: its only caller, User#set_avatar_url!, is
  never called (and calls a json method Resource doesn't have). Left out of calls: the git clone of
  each repo over HTTPS (GithubFetcher::Repo#clone, not an API request), OmniAuth's OAuth token and
  user-info requests to GitHub (library mechanics), the S3 sitemap upload through the AWS SDK
  adapter (config/sitemap.rb), mail over SMTP, Sentry, and Redis and Memcachier (key-value stores,
  no tables). Stores: the tables of db/schema.rb (the Ruby schema is the one Rails loads;
  db/structure.sql is stale, still lists the dropped opro_* tables and lacks most current tables, so
  it isn't used). Every table has an ActiveRecord model except data_dumps, which the schema creates
  but no code reads or writes: it is ignored (neither found nor wrong). schema_migrations and
  ar_internal_metadata are Rails' bookkeeping and also ignored. Deploys: Heroku. app.json (addons
  heroku-postgresql, heroku-redis, Heroku buildpacks), heroku.yml and the Procfile (web, worker,
  release phase running db:migrate) are the Heroku deployment; the GitHub workflow only lints and
  tests.
