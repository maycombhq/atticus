# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: piggymetrics
commit: 6bb2cf9ddbca980b664d3edbb6ff775d75369278
covers: [serves, calls, stores, deploys]
notes: >-
  Spring Cloud microservices (Spring Boot 2 / Netflix stack): a Zuul gateway that also serves a
  jQuery UI from its static folder, auth-service (OAuth2 authorization server), account-, statistics-
  and notification-service, plus config server, Eureka registry, Hystrix monitoring and Turbine.
  Service paths include the servlet context-path each service gets from the config server
  (config/src/main/resources/shared/<service>.yml: /accounts, /uaa, /statistics, /notifications).
  The gateway's Zuul routes (shared/gateway.yml) are recorded as serves of the gateway with the
  route path as written ("/uaa/**" etc.) and no method, since a route accepts every method; each
  route's forwarding is a call of the gateway to its service at the path the service receives (stripPrefix
  false, so the same path; the product owner's decision of 2026-10-24 that a gateway's routes count). Framework-provided endpoints are left out: the OAuth2
  token endpoint /uaa/oauth/token (@EnableAuthorizationServer), actuator, config server, Eureka,
  Hystrix dashboard and Turbine; the gateway's static index.html is not recorded as a page route.
  Feign clients resolve service ids through Eureka, so their paths are written as declared (they
  already include the target's context path). ExchangeRatesClient's base is rates.url =
  https://api.exchangeratesapi.io (shared/statistics-service.yml). The UI's calls are relative URLs
  against the gateway (accounts/current is /accounts/current). The UI's call to uaa/oauth/token, the
  services' client-credentials token requests, and the user-info token checks (/uaa/users/current
  via user-info-uri, made by Spring Security or the copied CustomUserInfoTokenServices) are
  auth-library mechanics and left out. The UI also calls api.exchangeratesapi.io directly
  (launch.js), counted as a third-party API call. login.js uses bare CR line endings; its line
  numbers count CR as a line break. Spring Cloud Bus (AMQP) and Hystrix stream publish to RabbitMQ
  through framework auto-configuration with no topic declared in the repo, so there are no event
  facts; e-mail goes over SMTP (JavaMailSender) and is not counted. Stores are the @Document MongoDB
  collections; account-service and statistics-service each have their own "accounts" collection in
  separate MongoDB instances, so both are listed. Deployment is docker-compose: the README says to
  copy docker-compose.yml and run it, and it runs the published images of every service; Travis
  only builds and pushes images.
