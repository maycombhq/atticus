# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: todo-nodejs-mongo
commit: 16695b06631a166eb5dc90ea2f0d52b917578013
covers: [serves, calls, stores, deploys]
notes: >-
  An Azure Developer CLI template: an Express API (src/api) and a React/Vite UI (src/web) for todo
  lists, with Bicep in infra/. Serves: routers are mounted in src/api/src/app.ts at /lists (line 59)
  and /lists/:listId/items (line 58); there is no global prefix. The Swagger UI page mounted at /
  (app.ts:63) is counted as GET /, the one server-rendered page. Calls: the UI's only HTTP client is
  the generic RestService (src/web/src/services/restService.ts, axios), built with base
  VITE_API_BASE_URL (default http://localhost:3100 in src/web/src/config/index.ts:18; at deploy time
  azure.yaml writes it from the Bicep output API_BASE_URL, which is the API App Service URI because
  useAPIM defaults to false, so no /todo APIM prefix) plus a base route of /lists or
  /lists/{listId}/items. Each call is cited at the action that issues it (src/web/src/actions);
  save() issues PUT when the entity has an id and POST otherwise, so both are listed at the same
  line. {param} names follow the API's route names. RestService.patch is never called, and the UI
  never calls the /items/state/{state} routes. Query options (top, skip) are left out. Telemetry to
  Application Insights is not counted. Stores: despite the repo name, the API uses the Cosmos DB
  NoSQL SDK (@azure/cosmos), not MongoDB; its two containers TodoList and TodoItem are cited where
  the code opens them (src/api/src/models/cosmosClient.ts), and infra/app/db-avm.bicep:7 and :13
  declare the same containers. Deploys: Bicep puts both the API and the web UI on Azure App Service
  (one shared Linux plan), so there is one azure-app-service entry cited at the API site module;
  the web site module is infra/app/web-appservice-avm.bicep:11. The Dockerfiles are not used by
  azure.yaml (host: appservice) and are not a deployment. Pipelines only run azd. Tests ignored.
