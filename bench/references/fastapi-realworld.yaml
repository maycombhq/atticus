# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: fastapi-realworld
commit: 029eb7781c60d5f563ee8990a0cbfb79b244538c
covers: [serves, calls, stores, deploys]
notes: >-
  The RealWorld (Conduit) API in FastAPI, with raw SQL in aiosql .sql files under
  app/db/queries/sql and pypika query builders in app/db/queries/tables.py. Serves: the top router
  is included under settings.api_prefix = "/api" (app/core/settings/app.py:27, applied at
  app/main.py:40); app/api/routes/api.py then adds /users (authentication), /user (current user),
  /profiles, /articles (via app/api/routes/articles/api.py:7-8) and /articles/{slug}/comments and
  /tags. Decorator paths of "" give the bare prefix (e.g. POST /api/users is register, GET /api/user
  is the current user). The generated OpenAPI and docs routes are left out. Calls: none; the app
  calls no other service (no HTTP client is used; starlette "requests" imports are the request
  type). Stores: seven tables, all created by the single Alembic migration
  app/db/migrations/versions/fdf8821871d7_main_tables.py and cited at each op.create_table. They
  are the same seven the .sql queries read and write; users_subquery and author_subquery in the
  SQL are aliases, not tables. The migration also creates an update_updated_at_column trigger
  function, not a table. Deploys: the README has a "Deployment with Docker" section whose
  instructions are docker-compose up -d db and docker-compose up -d app, and docker-compose.yml
  runs the app (restart: on-failure, port 8000) with its Postgres; no other platform is
  configured, so docker-compose is taken as the deployment and recorded as docker, cited at the
  app service. The Deploy workflow (.github/workflows/deploy.yml) only builds and pushes an image
  to Docker Hub, which is not a deployment.
