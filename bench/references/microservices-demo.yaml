# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: microservices-demo
commit: 38e7348eb289eb5b87c0c6e8cb19ced0449dc389
covers: [serves, calls, stores, deploys]
notes: >-
  Deploys: one platform, kubernetes; the Helm chart, Kustomize overlays and Terraform (which makes the GKE cluster) all deploy to it, so they are tooling, not separate platforms.
  Services covered: adservice (Java), cartservice (C#), checkoutservice, frontend, productcatalogservice,
  shippingservice (Go), currencyservice, paymentservice (Node.js), emailservice, recommendationservice,
  shoppingassistantservice (Python, Flask). gRPC serves cite the implementing method in each service,
  not the proto. grpc.health.v1: counted as grpc.health.v1.Health/Check only where this repo's own
  code implements and registers the handler (cartservice, currencyservice, paymentservice, emailservice,
  recommendationservice). checkoutservice, productcatalogservice and shippingservice define Check/Watch
  methods but register the grpc-go library health.NewServer() instead, and adservice uses the grpc-java
  HealthStatusManager, so those are left out. The Python Watch stubs only return UNIMPLEMENTED and are
  left out. emailservice SendOrderConfirmation cites DummyEmailService, the only mode that starts (the
  non-dummy mode raises). Frontend routes come from the gorilla/mux router in main.go; all are prefixed
  by an optional BASE_URL env var (empty by default). /, /product/{id} and /cart (GET) also accept HEAD,
  recorded once as GET. /robots.txt and /_healthz set no method and are recorded as GET; /static/ is a
  path-prefix file server. Outbound HTTP: frontend POSTs to shoppingassistantservice and, only when
  PACKAGING_SERVICE_URL is set, GETs an external packaging service that is not in this repo. Left out:
  generated stubs, tests, the loadgenerator (a locust test client), the AdServiceClient.java,
  client.js and client.py test clients, the frontend's GCP metadata-server lookup and the shopping
  assistant's Gemini and Secret Manager calls (made through Google SDKs, not service calls). Stores:
  Redis (the default cart store) has no tables, so it is not listed. Spanner CartItems is a constant in
  code. The AlloyDB table names come from env vars (ALLOYDB_TABLE_NAME) in code; the names cart_items
  (cart) and catalog_items (product catalog and shopping assistant) are declared in the kustomize setup
  script, cited at their CREATE TABLE. products.json is a file read, not a store. Deploys: one each for
  kubernetes-manifests, helm-chart, kustomize and terraform (GKE cluster); release/ and istio-manifests/
  are not counted as separate platforms.
