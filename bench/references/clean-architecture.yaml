notes: >-
  Jason Taylor's Clean Architecture dotnet new template: one ASP.NET Core minimal-API host (src/Web) with
  an Aspire AppHost, plus two SPA variants (src/Web/ClientApp Angular, src/Web/ClientApp-React React)
  of which the template keeps one. Endpoint groups are classes implementing IEndpointGroup, discovered by
  reflection in src/Web/Infrastructure/WebApplicationExtensions.cs; none overrides RoutePrefix, so every
  group is mounted at /api/<ClassName> (line 22 there). The repo's MapGet/MapPost helpers default the
  pattern to "" (the group root). Left out of serves: the ASP.NET Core Identity endpoints added by
  MapIdentityApi<ApplicationUser>() under /api/Users (register, login, refresh, confirmEmail, manage/info
  and the rest; they come from the library, not this repo; only the repo's own POST /api/Users/logout is
  listed); the dev-only /health and /alive from ServiceDefaults; MapOpenApi and Scalar; the static file
  server and the SPA fallback (MapFallbackToFile index.html); and the "/" redirect to /scalar, which only
  exists in the UseApiOnly template variant. Calls: both SPAs call the API through an NSwag client
  (web-api-client.ts) generated at build time and not committed; client method names are the endpoint
  names (handler method names, set by WithName in EndpointRouteBuilderExtensions.cs), so each call maps to
  one route. The API base is the SPA's own origin, proxied to the webapi service in dev (proxy.conf.js,
  vite.config.ts). Each endpoint is listed once per SPA, at its first call site; repeated calls (React
  Todo.jsx calls updateTodoItem twice, and Angular's unrouted fetch-data component repeats
  getWeatherForecasts) are not repeated. Calls to the Identity endpoints (login, register, infoGET) are
  left out as auth-library built-ins; logout is the repo's own and is listed. Stores: ApplicationDbContext
  is an IdentityDbContext with no migrations (the initialiser uses EnsureCreated), so table names are EF
  Core conventions: the DbSet names TodoLists and TodoItems (Colour is an owned type stored in TodoLists)
  and the seven default ASP.NET Core Identity tables, cited at the context declaration. The database is
  SQLite, SQL Server or PostgreSQL depending on the template option. Deploys: the AppHost calls
  AddAzureContainerAppEnvironment, so Aspire/azd publishing puts the web API on Azure Container Apps; the
  SPA is added to the AppHost only in run mode and is served from the API when published. There is no
  Bicep or infra folder at this commit; the GitHub workflows only build, test and pack the template.
