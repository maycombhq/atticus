# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: bulletproof-react
commit: 9506629ed003a561c6627735480cce4994244bb4
covers: [calls]
notes: >-
  A React reference architecture with three app variants of the same discussions app under apps/:
  react-vite (Vite SPA, axios client), nextjs-app (Next.js App Router, fetch-based client) and
  nextjs-pages (Next.js Pages Router, axios client). Each app has its own copy of the API layer
  (src/features/*/api and src/lib/auth.tsx) making the same 16 calls, so every call is listed once
  per app (48 in all) and the app is the folder in `at`. Base URLs come from each app's .env.example
  through src/config/env.ts and src/lib/api-client.ts: react-vite uses VITE_APP_API_URL =
  https://api.bulletproofapp.com (no path prefix, so its paths have no /api; its .env.example-e2e
  uses http://localhost:8080/api instead), and both Next.js apps use NEXT_PUBLIC_API_URL =
  http://localhost:8080/api, so their paths start /api. Query parameters (page, discussionId) are
  left out of paths; {param} names follow the template variables. The MSW mocks (src/testing/mocks,
  mock-server.ts) are test code and are left out, as are tests and e2e. No app serves an API of its
  own (no route handlers or pages/api); pages are not covered. Deploys are not covered: the GitHub
  workflows only build, lint and test, and there is no hosting config. docs/ is prose and was
  ignored.
