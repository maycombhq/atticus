# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: spring-realworld
commit: ee17e31aafe733d98c4853c8b9a74d7f2f6c924a
covers: [serves, calls, stores, deploys]
notes: >-
  The RealWorld (Conduit) back end in Spring Boot, with MyBatis XML mappers on SQLite and a
  GraphQL API through Netflix DGS. No context path is set in application.properties, so REST
  paths are the class-level @RequestMapping plus the method mapping (ArticleFavoriteApi,
  ProfileApi and TagsApi omit the leading slash; written here with it). REST entries cite the
  method mapping annotation. GraphQL entries are the root Query and Mutation fields, cited at
  schema.graphqls; each one has a DGS data fetcher in src/main/java/io/spring/graphql. Nested
  type resolvers (Profile.feed, Article.comments, payload fields and so on) are not counted as
  entry points. The /graphql endpoint itself is DGS's default and isn't listed as REST. The
  DGS codegen output (DgsConstants, generated types) is generated and was ignored. No
  outbound calls: image.default is a default avatar URL stored in data, never requested.
  Tables come from the one Flyway migration; the MyBatis mappers use only these tables. The
  only CI workflow runs tests, and there is no Dockerfile or deployment config, so deploys is
  empty.
