commit: 103de22da497c631708f0541a0cad0e662d04aa5
covers: [serves, calls, stores, deploys]
notes: >-
  Three Spring Boot 3 services (order, shipping, invoicing) under microservice-kafka/, each with
  Thymeleaf pages, JPA on its own Postgres database (dborder, dbshipping, dbinvoicing) and Kafka
  between them; docker/ holds the compose system with Zookeeper, Kafka, Postgres and an Apache
  httpd. Serves: each service's controller mappings, at the root (no context path is set; each runs
  on 8080 behind its own host port). The order service's form posts (POST /, POST /line) and DELETE
  /{id} are its own entries; shipping and invoicing both map GET / and GET /{id}, listed once per
  service. The shipping and invoicing @KafkaListener(topics = "order") are event-topic entries, one
  per listener. Left out: Spring Boot actuator endpoints
  (management.endpoints.web.exposure.include=*), the order service's static monitor.html, and the
  Apache httpd container, which only serves a static index page linking to the three host ports and
  Apache's own /balancer-manager handler: its 000-default.conf has no ProxyPass, so despite the
  README it forwards nothing and has no gateway routes. Calls: OrderService publishes each new order
  with kafkaTemplate.send("order", ...) as JSON; shipping and invoicing read the same message into
  their own Shipment and Invoice classes. No service calls another over HTTP. Stores: JPA tables
  under Spring Boot's naming (CamelCaseToUnderscoresNamingStrategy and
  SpringImplicitNamingStrategy), cited at the entity or field that makes them: order has ORDERTABLE
  (@Table), order_line, customer and item, and the join table of its unidirectional @OneToMany
  List<OrderLine> orderLine with no @JoinColumn, named owning table + "_" + property:
  ordertable_order_line; shipping has shipment, shipment_line and shipment_shipment_line; invoicing
  has invoice, invoice_line and invoice_invoice_line (Customer, Item and Address are @Embeddable
  there, so they are columns, not tables). The schema comes from ddl-auto=update; there are no SQL
  scripts. Deploys: none. docker/docker-compose.yml builds and runs the whole system, but
  docker/README.md calls it an insecure demo ("DO NOT RUN THIS IN PRODUCTION") run locally or on a
  Docker Machine VM, and the GitHub workflow only builds the jars and the images (docker-compose
  build) without running them anywhere, so compose is local running here, not a deployment.
