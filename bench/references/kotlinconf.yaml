# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: kotlinconf
commit: 907ce238e1ffe2472991eeb2d2bfa386bdb4ea8f
covers: [serves, calls, stores, deploys]
notes: >-
  The KotlinConf app: a Ktor backend (backend/, Koin, Exposed on Postgres with its own SQL migration
  runner) and Kotlin Multiplatform clients (app/shared, used by the Android, iOS, desktop and web
  apps) plus a Compose HTML admin SPA (app/adminApp) that the backend serves. Serves:
  backend/RoutesModule.kt registers /healthz (an app-declared route, kept), the year-agnostic time,
  admin (POST /sessionizeSync) and config routes, and the year-based routes inside route("/{year}"),
  so those paths start /{year}/ (vote and feedback add a nested route()). Each entry is cited at its
  get()/post() line, or at the route("vote") / route("feedback") line for the bare get {} and post
  {} inside it. Left out: the admin SPA's static assets under /admin (staticResources, a static
  shell like a gateway's static folder). Calls: the backend's Ktor HttpClient fetches the Sessionize
  schedule (sessionize.url in application.yaml, GET /api/v2/2r0suvtg/view/All, cited at the config
  line that holds the path; called on a timer and by POST /sessionizeSync) and proxies speaker
  images (GET /image/{imageId} on sessionize.imagesUrl, cited at the call). The shared client
  (ApplicationApi and YearlyApi in app/shared/.../network) calls the backend at URLs.PRODUCTION_URL
  (or staging) with encodedPath "time", "config" or "$year/<path>", so its paths are /time, /config
  and /{year}/...; the admin SPA (AdminApi.kt) calls its own origin's /{year}/conference,
  /{year}/vote/all and /{year}/feedback/summary (a front end calling its back end: calls, to
  backend). GET /{year}/conference is called by both clients and listed once per caller. The shared
  client also downloads assets with downloadAsset(path): the five document paths are literals in
  ConferenceService.kt ("documents/app-terms.md"...), so they are one call to the route they hit,
  GET /{year}/documents/{name}, cited at the literal list; the literal forms
  (/{year}/documents/app-terms.md...) are ignored rather than wrong. Map downloads take their paths
  from the conference-info data the backend serves (runtime data) and are ignored, as are images the
  UI loads by URL from data (partner logos, speaker photos). Not calls: the app's links to web pages
  (URLs.kt: homepage, stores, social sites) and the debug-only fake data. Stores: the four Exposed
  tables (object names Users, Votes, Feedback, SignedPolicies; the V001 to V004 migrations create
  them, V003 renaming SignedPolicies to lower case), cited at the table objects. The migration
  runner's schema_migrations table is bookkeeping and ignored. Deploys: the backend on Heroku
  (Procfile web: java -jar backend.jar -port=$PORT; app.json's GRADLE_TASK "that Heroku will run"),
  and the web app on GitHub Pages (.github/workflows/web-deploy.yml, actions/deploy-pages). The
  mobile and desktop apps are store and desktop distributions, not deploy platforms.
