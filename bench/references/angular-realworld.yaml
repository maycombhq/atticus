# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: angular-realworld
commit: dd99ed2cf39c805d719f943c5d7061a5683d98a8
covers: [calls]
notes: >-
  An Angular single-page front end (Conduit) for the RealWorld API. Every HTTP call is in five
  services (user, articles, comments, tags, profile) and uses a relative path; apiInterceptor
  (src/app/core/interceptors/api.interceptor.ts:4, registered in src/app/app.config.ts:73) prefixes
  every request with https://api.realworld.show/api, so every path starts /api. There are no
  environment files. ArticlesService.query (articles.service.ts:21) calls GET /api/articles or GET
  /api/articles/feed depending on config.type, so it is listed as two calls at the same line; the
  query string (filters) is left out. Multi-line calls are cited at the line holding the
  get/post/put/delete. Pages (serves) are not covered. Deploys are not covered: the deploy workflow
  only builds and zips the app into a GitHub release, and src/_redirects is a single SPA rewrite
  with no netlify.toml or other hosting config. The realworld git submodule (the API spec and its
  tests), unit tests (*.spec.ts) and e2e were ignored.
