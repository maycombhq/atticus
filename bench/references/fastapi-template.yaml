# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: fastapi-template
commit: b1125d8839482cb7bbae603ddc6d0081bf87532e
covers: [serves, calls, stores, deploys, fields, config]
notes: >-
  A FastAPI back end (backend/app) plus a React single-page front end (frontend/src) that the
  backend image builds and serves itself (backend/Dockerfile copies the built front end in;
  backend/app/main.py:36 mounts it with app.frontend("/")). Serves: every router is included under
  settings.API_V1_STR = "/api/v1" (backend/app/core/config.py:22, applied at
  backend/app/main.py:35), then each router's own prefix (/items, /users, /utils, /private; login
  has none). FastAPI joins prefix and decorator path literally, so "/items" + "/" is "/items/"
  with the trailing slash. The private router (POST /api/v1/private/users/) is only included when
  FASTAPI_ENV == "development" (backend/app/api/main.py:13); it is listed because the repo's .env
  sets FASTAPI_ENV=development. The static front-end mount at "/" and the generated
  /api/v1/openapi.json and docs routes are left out (not declared routes). Calls: the front end
  calls its own back end only through the generated client in frontend/src/client (generated by
  @hey-api/openapi-ts, ignored as generated code). Each call is cited at the front end's call site
  of a generated method (UsersService.readUsers etc.) and resolved to the method and url that
  method uses in frontend/src/client/sdk.gen.ts. The base URL is VITE_API_URL
  (frontend/src/main.tsx:18), http://localhost:8000 in frontend/.env:1 and "" (same origin) in the
  deploy workflow, so paths are written as requested. GET /api/v1/users/me is called at two sites
  and listed once at its first (frontend/src/hooks/useAuth.ts:25; also
  frontend/src/routes/_layout/admin.tsx:23). Generated methods the front end never calls
  (testToken, recoverPasswordHtmlContent, readUserById, readItem, testEmail, healthCheck, private
  createUser) are not calls. The back end makes no HTTP calls; it sends email over SMTP
  (backend/app/utils.py:56) and reports to Sentry, neither counted. Playwright tests call Mailpit
  and the private API; tests are ignored. Stores: two SQLModel tables, User and Item, with table
  names inferred from the class names as "user" and "item" (confirmed by the first Alembic
  migration, backend/app/alembic/versions/e2412789c190_initialize_models.py:21 and :34); cited at
  the table=True classes. Deploys: docker-compose IS the production deployment here. The
  "Deploy with Docker Compose" workflow (.github/workflows/deploy-docker-compose.yml:41) runs
  docker compose -f compose.yml -f compose.deploy.yml up -d on a self-hosted server, and
  compose.deploy.yml adds restart: always, public ports 80/443, Traefik HTTPS routing on the real
  DOMAIN and Let's Encrypt certificates, so it is counted as docker (cited at the backend service
  in compose.deploy.yml). compose.override.yml is local development (mailpit, playwright, reload)
  and is not a deployment. A second workflow (.github/workflows/deploy.yml:51) deploys the same
  app to FastAPI Cloud with fastapi deploy; that platform is not in the standard list and is
  recorded as fastapi-cloud.
  Fields and config (ADR 0124 section 6, added 2026-10-24): request fields are each route's
  Pydantic body model and its query parameters (skip, limit, email_to); the login form gives
  username and password, the two fields the code reads (login.py:31), and the other OAuth2 form
  fields are ignored. Response fields are the response_model or returned model; the HTML and
  boolean responses have none. Columns are the SQLModel table fields of user and item
  (relationships are not columns). Fields of calls are not judged. Config is the Settings keys that
  name another system (DATABASE_URL, SENTRY_DSN, FRONTEND_HOST, the SMTP_ keys), a timeout (the two
  token expiries) or a flag (FASTAPI_ENV), and the front end's VITE_API_URL; the API prefix,
  project name, secret key, first superuser, email sender and compose and Traefik keys are ignored.
