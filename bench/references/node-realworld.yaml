# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: node-realworld
commit: 30b68e1e881462b2f4164ea09ab4c4f5699c7b0b
covers: [serves, calls, stores]
notes: >-
  The RealWorld (Conduit) back end in Express with Prisma on PostgreSQL. Every controller router
  is mounted under /api in src/app/routes/routes.ts, so all controller paths carry that prefix;
  Express :param segments are written as {param}. GET / in src/main.ts is a status route and is
  included; express.static serving src/assets is not listed as a route. It calls no other
  service (the api.realworld.io image URLs are default avatar strings, not calls). Tables use the
  names Prisma gives them with no @@map: the models Article, Comment, Tag and User keep their model
  names, and the implicit many-to-many relations create the join tables _ArticleToTag,
  _UserFavorites and _UserFollows, cited at the migrations that create them (the ArticleTags table
  from the first migration is dropped by a later one, so it is left out). The Dockerfile only
  builds an image and there are no deployment manifests, so deploys is not covered.
