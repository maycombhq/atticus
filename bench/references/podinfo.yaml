# Written by reading the code at the pinned commit, not from an Atticus scan.
repo: podinfo
commit: 3e0ff8ae123b710bc91de1315cba0f996a8896c2
covers: [serves, calls, stores, deploys]
notes: >-
  podinfo is a small Go demo microservice with an HTTP API (gorilla/mux) and a gRPC API. The
  --prefix flag defaults to "/" (cmd/podinfo/main.go:33), so routes are listed without a prefix,
  and the extra rootPath+"/" routes registered only for a non-root prefix are left out. Routes
  with no .Methods() accept every method and have no method key; a route with several methods is
  one entry per method. GET / is registered twice (an HTML page for browsers, JSON info
  otherwise) and is listed once. Left out: the PathPrefix catch-alls /echo/, /api/echo/ (the same
  echo handler as /echo and /api/echo), /debug/pprof/ (the net/http/pprof library) and /swagger/
  (the http-swagger UI library); the separate metrics-port server's /metrics and /healthz, which
  repeat paths already listed; and gRPC reflection and the grpc.health.v1 health service, which
  are library built-ins. gRPC paths use the proto package names (headers.proto declares package
  header). The only outbound call is the echo handler's POST to each --backend-url; the Kustomize
  frontend base sets it to http://backend:9898/echo (deploy/bases/frontend/deployment.yaml:41),
  another podinfo instance, so the path is /echo. Redis (the /cache routes and a heartbeat key)
  is a key-value store with no tables and the /store routes write files, so stores is empty.
  podcli is a separate diagnostic CLI that calls whatever address a user passes, so its requests
  are not counted. The Helm chart, the Kustomize bases and overlays, the plain manifests under
  deploy/ and the Timoni module all target Kubernetes; otel/docker-compose.yaml is a local
  tracing stack, not a deployment.
