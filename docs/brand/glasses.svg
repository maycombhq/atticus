<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Atticus's mark: Atticus Finch's glasses. Two fine round lenses and a straight bridge, with a
       glint in each lens leaning toward the other, so the two glints are the legs of an A. On a
       24-unit grid; the lines are 0.8 wide in large marks and heavier as the mark gets small
       (rings 1.25 and glints 1.05 at 26 px, 1.7 and 1.3 at 24 px and below). -->
  <g fill="none" stroke="currentColor" stroke-linecap="round"><g stroke-width="0.8"><circle cx="6.5" cy="12.4" r="4.5"/><circle cx="17.5" cy="12.4" r="4.5"/><path d="M11 11.4 H13"/></g><path stroke-width="0.8" d="M3.7 11.3 Q3.9 10.0 5.2 9.6 M20.3 11.3 Q20.1 10.0 18.8 9.6"/></g>
</svg>
