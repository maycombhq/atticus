schemaVersion: 1
name: forge-messaging
version: 0.1.0
description: Forge Messaging apps name themselves in messaging.yaml, consume queues and channels with annotations, call relay clients through @RelayClient interfaces, and set relay client timeouts in application.yml.
extends: []
appliesTo:
  marker: messaging.yaml
layout:
  sourceRoots: [src/main/java]
  configFiles: [src/main/resources/application.yml]
rules:
  - id: forge-messaging-queue-consumer
    description: A method annotated @QueueConsumer consumes a message queue, so the app serves an mq-queue endpoint.
    match:
      annotation: QueueConsumer
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Endpoint
      id: "${yaml:messaging.yaml#app}.queue.${attr.queue | slug}"
      fields:
        component: "${yaml:messaging.yaml#app}"
        endpointType: mq-queue
        pathOrTopic: "${attr.queue}"
      evidence: { source: code, side: callee }
    confidence: verified

  - id: forge-messaging-relay-call
    description: A method annotated @RelayCall in a @RelayClient interface makes a direct synchronous request to the service the client targets.
    match:
      annotation: RelayCall
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Interface
      fields:
        from: "${yaml:messaging.yaml#app}"
        to: "${annotation.RelayClient.target}"
        via: direct
        method: "${attr.verb | upper}"
        normalizedPath: "${attr.route | normalizePath}"
        sync: sync
      evidence: { source: code, side: caller }
    confidence: inferred

  - id: forge-messaging-emits
    description: A method annotated @Emits publishes to a channel; the consumers are resolved later.
    match:
      annotation: Emits
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Unresolved
      id: "${yaml:messaging.yaml#app}.publish.${attr.channel | slug}"
      fields:
        unresolvedKind: event-publish
        raw: "${attr.channel}"
        owner: "${yaml:messaging.yaml#app}"
      evidence: { source: code, side: caller }
    confidence: inferred

  - id: forge-messaging-on-message
    description: A method annotated @OnMessage consumes a channel; the producers are resolved later.
    match:
      annotation: OnMessage
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Unresolved
      id: "${yaml:messaging.yaml#app}.subscribe.${attr.channel | slug}"
      fields:
        unresolvedKind: event-subscribe
        raw: "${attr.channel}"
        owner: "${yaml:messaging.yaml#app}"
      evidence: { source: code, side: callee }
    confidence: inferred

  - id: forge-messaging-relay-client-timeout
    description: A relay.clients.<client>.timeout key in application.yml is the timeout of that relay client.
    match:
      configKey: relay.clients.*.timeout
      files: [src/main/resources/application.yml]
    emit:
      kind: Setting
      id: "${yaml:messaging.yaml#app}.${match.3 | slug}.timeout"
      fields:
        component: "${yaml:messaging.yaml#app}"
        settingKind: timeout
        key: "${match.1}.${match.2}.${match.3}.${match.4}"
        valueOrRef: "${match.0}"
      evidence: { source: config, side: definition }
    confidence: verified

tests:
  - name: order-intake records
    fixture: ../../repos/order-intake
    expect:
      - kind: Endpoint
        id: order-intake.queue.orders.in
        component: order-intake
        endpointType: mq-queue
        pathOrTopic: ORDERS.IN
        confidence: verified
      - kind: Interface
        id: if-388dac6b99d62ee6
        from: order-intake
        to: inventory-api
        via: direct
        method: GET
        normalizedPath: /stock/{}
        sync: sync
        confidence: inferred
      - kind: Interface
        id: if-39f6d71491016a72
        from: order-intake
        to: inventory-api
        via: direct
        method: POST
        normalizedPath: /reservations
        sync: sync
        confidence: inferred
      - kind: Unresolved
        id: order-intake.publish.orders.received
        unresolvedKind: event-publish
        raw: orders.received
        owner: order-intake
        confidence: inferred
      - kind: Unresolved
        id: order-intake.subscribe.payments.settled
        unresolvedKind: event-subscribe
        raw: payments.settled
        owner: order-intake
        confidence: inferred
      - kind: Setting
        id: order-intake.inventory-api.timeout
        component: order-intake
        settingKind: timeout
        key: relay.clients.inventory-api.timeout
        valueOrRef: 2s
        confidence: verified
    absent:
      - order-intake.publish.orders.audit
      - order-intake.subscribe.test.orders

  - name: inventory-sync records
    fixture: ../../repos/inventory-sync
    expect:
      - kind: Endpoint
        id: inventory-sync.queue.stock.adjust
        component: inventory-sync
        endpointType: mq-queue
        pathOrTopic: STOCK.ADJUST
        confidence: verified
      - kind: Interface
        id: if-444a80174d7113fb
        from: inventory-sync
        to: warehouse-gateway
        via: direct
        method: PUT
        normalizedPath: /bins/{}
        sync: sync
        confidence: inferred
      - kind: Interface
        id: if-a335408ee3c9f01d
        from: inventory-sync
        to: warehouse-gateway
        via: direct
        method: GET
        normalizedPath: /bins/{}/contents
        sync: sync
        confidence: inferred
      - kind: Unresolved
        id: inventory-sync.publish.stock.changed
        unresolvedKind: event-publish
        raw: stock.changed
        owner: inventory-sync
        confidence: inferred
      - kind: Unresolved
        id: inventory-sync.subscribe.orders.received
        unresolvedKind: event-subscribe
        raw: orders.received
        owner: inventory-sync
        confidence: inferred
      - kind: Setting
        id: inventory-sync.warehouse-gateway.timeout
        component: inventory-sync
        settingKind: timeout
        key: relay.clients.warehouse-gateway.timeout
        valueOrRef: 5000ms
        confidence: verified
    absent:
      - inventory-sync.server.timeout
      - inventory-sync.warehouse-gateway.retries

  - name: notify-worker records
    fixture: ../../repos/notify-worker
    expect:
      - kind: Endpoint
        id: notify-worker.queue.notify.retry
        component: notify-worker
        endpointType: mq-queue
        pathOrTopic: NOTIFY.RETRY
        confidence: verified
      - kind: Unresolved
        id: notify-worker.publish.notifications.sent
        unresolvedKind: event-publish
        raw: notifications.sent
        owner: notify-worker
        confidence: inferred
      - kind: Unresolved
        id: notify-worker.subscribe.orders.received
        unresolvedKind: event-subscribe
        raw: orders.received
        owner: notify-worker
        confidence: inferred
      - kind: Unresolved
        id: notify-worker.subscribe.stock.changed
        unresolvedKind: event-subscribe
        raw: stock.changed
        owner: notify-worker
        confidence: inferred
    absent:
      - notify-worker.server.port

  - name: no messaging.yaml, no records
    files:
      src/main/java/x/Handlers.java: |
        public class Handlers {
          @QueueConsumer(queue = "ORDERS.IN")
          public void onOrder(Object message) { }
        }
    expect: []

  - name: lower-case queue, attributes in any order, path parameter styles
    files:
      messaging.yaml: "app: ledger\n"
      src/main/java/x/Client.java: |
        @RelayClient(target = "payments")
        public interface Client {
          @RelayCall(route = "/payments/:id/refund", verb = "post")
          void refund(String id);
        }
      src/main/java/x/Handlers.java: |
        public class Handlers {
          @QueueConsumer(queue = "orders.in", concurrency = 2)
          public void onOrder(Object message) { }
        }
    expect:
      - kind: Endpoint
        id: ledger.queue.orders.in
        pathOrTopic: orders.in
        endpointType: mq-queue
      - kind: Interface
        id: if-427312294fb00633
        from: ledger
        to: payments
        method: POST
        normalizedPath: /payments/{}/refund

  - name: commented-out annotations and test code produce nothing
    files:
      messaging.yaml: "app: ledger\n"
      src/main/java/x/Handlers.java: |
        public class Handlers {
          // @Emits(channel = "ledger.closed")
          /* @QueueConsumer(queue = "LEDGER.CLOSE") */
          public void noop() { }
        }
      src/test/java/x/HandlersTest.java: |
        public class HandlersTest {
          @OnMessage(channel = "test.only", group = "test")
          public void capture(Object message) { }
        }
    expect: []

  - name: near-miss config keys produce no settings
    files:
      messaging.yaml: "app: ledger\n"
      src/main/resources/application.yml: |
        relay:
          server:
            timeout: 30s
          clients:
            ledger:
              retries: 3
              timeout:
                extra: 1
    expect: []
