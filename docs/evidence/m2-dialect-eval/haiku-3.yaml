schemaVersion: 1
name: forge-messaging
version: 0.1.0
description: Forge Messaging apps name themselves in messaging.yaml, consume queues and channels with @QueueConsumer and @OnMessage, publish with @Emits, call relay clients declared with @RelayClient and @RelayCall, and set relay client timeouts under relay.clients in application.yml.
extends: []
appliesTo:
  marker: messaging.yaml
layout:
  sourceRoots: [src/main/java]
  configFiles: [src/main/resources/application.yml]
rules:
  - id: forge-messaging-queue-consumer
    description: A method annotated @QueueConsumer consumes a message queue that the app serves as an mq-queue endpoint.
    match:
      annotation: QueueConsumer
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Endpoint
      id: "${yaml:messaging.yaml#app}.queue.${attr.queue | slug}"
      fields:
        component: "${yaml:messaging.yaml#app}"
        endpointType: mq-queue
        pathOrTopic: "${attr.queue}"
      evidence: { source: code, side: callee }
    confidence: verified

  - id: forge-messaging-relay-call
    description: A method annotated @RelayCall in a @RelayClient interface makes a direct synchronous request to the service the client targets.
    match:
      annotation: RelayCall
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Interface
      fields:
        from: "${yaml:messaging.yaml#app}"
        to: "${annotation.RelayClient.target}"
        via: direct
        method: "${attr.verb | upper}"
        normalizedPath: "${attr.route | normalizePath}"
        sync: sync
      evidence: { source: code, side: caller }
    confidence: inferred

  - id: forge-messaging-emits
    description: A method annotated @Emits publishes to a channel; the consumer is resolved later from the channel's other end.
    match:
      annotation: Emits
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Unresolved
      id: "${yaml:messaging.yaml#app}.publish.${attr.channel | slug}"
      fields:
        unresolvedKind: event-publish
        raw: "${attr.channel}"
        owner: "${yaml:messaging.yaml#app}"
      evidence: { source: code, side: caller }
    confidence: inferred

  - id: forge-messaging-on-message
    description: A method annotated @OnMessage consumes a channel; the producer is resolved later from the channel's other end.
    match:
      annotation: OnMessage
      target: method
      files: ["src/main/java/**/*.java"]
    emit:
      kind: Unresolved
      id: "${yaml:messaging.yaml#app}.subscribe.${attr.channel | slug}"
      fields:
        unresolvedKind: event-subscribe
        raw: "${attr.channel}"
        owner: "${yaml:messaging.yaml#app}"
      evidence: { source: code, side: callee }
    confidence: inferred

  - id: forge-messaging-client-timeout
    description: A timeout key under relay.clients in application.yml is the timeout the app allows calls to that relay client.
    match:
      configKey: relay.clients.*.timeout
      files: [src/main/resources/application.yml]
    emit:
      kind: Setting
      id: "${yaml:messaging.yaml#app}.${match.3 | slug}.timeout"
      fields:
        component: "${yaml:messaging.yaml#app}"
        settingKind: timeout
        key: "relay.clients.${match.3}.timeout"
        valueOrRef: "${match.0}"
      evidence: { source: config }
    confidence: verified

tests:
  - name: order-intake records
    fixture: ../../repos/order-intake
    expect:
      - kind: Endpoint
        id: order-intake.queue.orders.in
        confidence: verified
        component: order-intake
        endpointType: mq-queue
        pathOrTopic: ORDERS.IN
      - kind: Interface
        id: if-388dac6b99d62ee6
        confidence: inferred
        from: order-intake
        to: inventory-api
        via: direct
        method: GET
        normalizedPath: /stock/{}
        sync: sync
      - kind: Interface
        id: if-39f6d71491016a72
        confidence: inferred
        from: order-intake
        to: inventory-api
        via: direct
        method: POST
        normalizedPath: /reservations
        sync: sync
      - kind: Unresolved
        id: order-intake.publish.orders.received
        confidence: inferred
        unresolvedKind: event-publish
        raw: orders.received
        owner: order-intake
      - kind: Unresolved
        id: order-intake.subscribe.payments.settled
        confidence: inferred
        unresolvedKind: event-subscribe
        raw: payments.settled
        owner: order-intake
      - kind: Setting
        id: order-intake.inventory-api.timeout
        confidence: verified
        component: order-intake
        settingKind: timeout
        key: relay.clients.inventory-api.timeout
        valueOrRef: 2s
    absent: [order-intake.publish.orders.audit, order-intake.subscribe.test.orders]
  - name: inventory-sync records
    fixture: ../../repos/inventory-sync
    expect:
      - kind: Endpoint
        id: inventory-sync.queue.stock.adjust
        confidence: verified
        component: inventory-sync
        endpointType: mq-queue
        pathOrTopic: STOCK.ADJUST
      - kind: Interface
        id: if-444a80174d7113fb
        confidence: inferred
        from: inventory-sync
        to: warehouse-gateway
        via: direct
        method: PUT
        normalizedPath: /bins/{}
        sync: sync
      - kind: Interface
        id: if-a335408ee3c9f01d
        confidence: inferred
        from: inventory-sync
        to: warehouse-gateway
        via: direct
        method: GET
        normalizedPath: /bins/{}/contents
        sync: sync
      - kind: Unresolved
        id: inventory-sync.publish.stock.changed
        confidence: inferred
        unresolvedKind: event-publish
        raw: stock.changed
        owner: inventory-sync
      - kind: Unresolved
        id: inventory-sync.subscribe.orders.received
        confidence: inferred
        unresolvedKind: event-subscribe
        raw: orders.received
        owner: inventory-sync
      - kind: Setting
        id: inventory-sync.warehouse-gateway.timeout
        confidence: verified
        component: inventory-sync
        settingKind: timeout
        key: relay.clients.warehouse-gateway.timeout
        valueOrRef: 5000ms
    absent: [inventory-sync.server.timeout]
  - name: notify-worker records
    fixture: ../../repos/notify-worker
    expect:
      - kind: Endpoint
        id: notify-worker.queue.notify.retry
        confidence: verified
        component: notify-worker
        endpointType: mq-queue
        pathOrTopic: NOTIFY.RETRY
      - kind: Unresolved
        id: notify-worker.publish.notifications.sent
        confidence: inferred
        unresolvedKind: event-publish
        raw: notifications.sent
        owner: notify-worker
      - kind: Unresolved
        id: notify-worker.subscribe.orders.received
        confidence: inferred
        unresolvedKind: event-subscribe
        raw: orders.received
        owner: notify-worker
      - kind: Unresolved
        id: notify-worker.subscribe.stock.changed
        confidence: inferred
        unresolvedKind: event-subscribe
        raw: stock.changed
        owner: notify-worker
    absent: [notify-worker.publish.stock.changed, notify-worker.server.port]
  - name: attribute order, lower-case verbs, path parameter styles and near-miss keys
    files:
      messaging.yaml: "app: billing\n"
      src/main/java/billing/Calls.java: |
        package billing;
        @RelayClient(target = "ledger-gateway")
        public interface Calls {
          @RelayCall(route = "/a/:id/b?x=1", verb = "get")
          Object one(String id);
        }
      src/main/java/billing/Handlers.java: |
        package billing;
        public class Handlers {
          @OnMessage(group = "g", channel = "Order Placed!")
          public void placed(Object m) { }
          @QueueConsumer(concurrency = 2, queue = "billing.retry")
          public void retry(Object m) { }
          @Emits(channel = "orders.received")
          public Object sent(Object m) { return m; }
          // @Emits(channel = "orders.audit")
        }
      src/main/resources/application.yml: |
        relay:
          clients:
            ledger-gateway:
              timeout: 1s
              retries: 3
          server:
            timeout: 30s
        clients:
          other:
            timeout: 9s
    expect:
      - kind: Interface
        id: if-533089db68435d42
        confidence: inferred
        from: billing
        to: ledger-gateway
        via: direct
        method: GET
        normalizedPath: /a/{}/b
        sync: sync
      - kind: Unresolved
        id: billing.subscribe.order-placed
        confidence: inferred
        unresolvedKind: event-subscribe
        raw: Order Placed!
        owner: billing
      - kind: Endpoint
        id: billing.queue.billing.retry
        confidence: verified
        endpointType: mq-queue
        pathOrTopic: billing.retry
      - kind: Unresolved
        id: billing.publish.orders.received
        confidence: inferred
        unresolvedKind: event-publish
        raw: orders.received
        owner: billing
      - kind: Setting
        id: billing.ledger-gateway.timeout
        confidence: verified
        settingKind: timeout
        key: relay.clients.ledger-gateway.timeout
        valueOrRef: 1s
    absent: [billing.publish.orders.audit, billing.server.timeout, billing.other.timeout, billing.ledger-gateway.retries]
  - name: test code and comments produce nothing
    files:
      messaging.yaml: "app: billing\n"
      src/test/java/billing/HandlersTest.java: |
        package billing;
        public class HandlersTest {
          @QueueConsumer(queue = "TEST.ONLY")
          public void q(Object m) { }
          @OnMessage(channel = "test.only", group = "t")
          public void o(Object m) { }
        }
      src/main/java/billing/Commented.java: |
        package billing;
        public class Commented {
          // @Emits(channel = "orders.audit")
          /* @QueueConsumer(queue = "OLD.Q") */
          public void nothing() { }
        }
    expect: []
  - name: no messaging.yaml, no records
    files:
      src/main/java/x/Handlers.java: |
        package x;
        public class Handlers {
          @QueueConsumer(queue = "ORDERS.IN")
          public void onOrder(Object m) { }
          @Emits(channel = "orders.received")
          public Object accepted(Object m) { return m; }
        }
    expect: []
