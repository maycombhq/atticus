name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm denylist
      - run: pnpm lint
      - run: pnpm typecheck
      # Windows runners are slower; fewer packages testing at once keeps timing-sensitive tests honest.
      - run: pnpm turbo run test --concurrency=${{ matrix.os == 'windows-latest' && '2' || '10' }}
