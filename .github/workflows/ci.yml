name: CI

# Every push and pull request runs the check on Linux and Windows (Node 22): the definition of
# done in CLAUDE.md needs both, and Windows is where most installs run. The full matrix adds
# Node 24 and the offline bundle install, when started by hand (Actions > CI > Run workflow,
# full: true) and before a release.
#
# The check is split into jobs that run at once, on each system: `lint` (deny-list, lint and
# typecheck), `test` (every package's tests, in shards), and `speed` (the speed budgets, alone on
# their runner). `check` waits for all of them and is the one result to require.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (Linux and Windows, Node 22 and 24)"
        type: boolean
        default: true

permissions:
  contents: read

# A newer push cancels the run for an older one.
concurrency:
  group: ci-${{ github.ref }}
  # On main a push waits for the run before it, so every commit's Windows result comes back
  # (the runs there are long, and pushes kept cancelling them); elsewhere the newest wins.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Kept between runs (actions/cache): the build's outputs, keyed by turbo's hash of each
  # package's sources (turbo.json), so a package whose sources didn't change isn't built again.
  TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/build

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest became 26.04, where Playwright 1.56 has no Chromium to install.
        os: [ubuntu-24.04, windows-latest]
        node: ${{ github.event_name == 'workflow_dispatch' && inputs.full && fromJSON('[22,24]') || fromJSON('[22]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/build
          key: turbo-build-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-node${{ matrix.node }}-
      - run: pnpm build
      # This job keeps the build for the next run, with only this build's entries in it, so the
      # cache doesn't grow with every commit. The other jobs build too, from the same cache.
      - if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          pnpm exec turbo run build --dry=json > "$RUNNER_TEMP/build.json"
          node .github/scripts/ci-shard.mjs prune .turbo/build "$RUNNER_TEMP/build.json"
        shell: bash
      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/build
          key: turbo-build-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
      - run: pnpm denylist
      - run: pnpm lint
      - run: pnpm typecheck

  # Every package's tests but the speed budgets, split so no runner takes more than about ten
  # minutes: `unit` shares the packages out, cli's test files and the role journeys are shared
  # out by file, each by their measured times (.github/scripts/ci-shard.mjs, which takes in a new
  # package or file by itself). Linux runs the tests in about half Windows' time, so it has fewer
  # shards: 19 jobs in all, under the 20 an account's hosted runners run at once. Only the journey
  # shards install Chromium.
  test:
    name: test (${{ matrix.plan.os }}, ${{ matrix.node }}, ${{ matrix.plan.shard }})
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'workflow_dispatch' && inputs.full && fromJSON('[22,24]') || fromJSON('[22]') }}
        # ubuntu-latest became 26.04, where Playwright 1.56 has no Chromium to install.
        plan:
          - { os: ubuntu-24.04, shard: unit 1/2 }
          - { os: ubuntu-24.04, shard: unit 2/2 }
          - { os: ubuntu-24.04, shard: cli 1/1 }
          - { os: ubuntu-24.04, shard: journeys 1/3 }
          - { os: ubuntu-24.04, shard: journeys 2/3 }
          - { os: ubuntu-24.04, shard: journeys 3/3 }
          - { os: windows-latest, shard: unit 1/3 }
          - { os: windows-latest, shard: unit 2/3 }
          - { os: windows-latest, shard: unit 3/3 }
          - { os: windows-latest, shard: cli 1/2 }
          - { os: windows-latest, shard: cli 2/2 }
          - { os: windows-latest, shard: journeys 1/4 }
          - { os: windows-latest, shard: journeys 2/4 }
          - { os: windows-latest, shard: journeys 3/4 }
          - { os: windows-latest, shard: journeys 4/4 }
    runs-on: ${{ matrix.plan.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: shard
        run: |
          read -r kind part <<< "${{ matrix.plan.shard }}"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "i=${part%/*}" >> "$GITHUB_OUTPUT"
          echo "n=${part#*/}" >> "$GITHUB_OUTPUT"
          echo "name=$kind-${part%/*}-of-${part#*/}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/build
          key: turbo-build-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-node${{ matrix.node }}-
      - if: steps.shard.outputs.kind == 'journeys'
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('packages/journeys/package.json') }}
      # The role journeys drive the app in Chromium.
      - if: steps.shard.outputs.kind == 'journeys'
        run: pnpm --filter @maycombhq/journeys exec playwright install --with-deps chromium
      - run: pnpm build
      # Test results are kept only for the same tree: tests read files across the repo (fixtures,
      # docs, other packages) that turbo can't see, so a result from any other tree could hide a
      # failure. A re-run, or a commit whose tree was tested before, runs only what didn't pass.
      - id: test-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/test
          key: turbo-test-${{ runner.os }}-node${{ matrix.node }}-${{ steps.shard.outputs.name }}-${{ steps.shard.outputs.tree }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-test-${{ runner.os }}-node${{ matrix.node }}-${{ steps.shard.outputs.name }}-${{ steps.shard.outputs.tree }}-
      # --only: the build ran above. --continue: every package's tests run, so one run shows
      # every failure, not the first. Two packages at a time keeps timing-sensitive tests honest.
      - id: tests
        env:
          TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/test
        run: |
          i=${{ steps.shard.outputs.i }}
          n=${{ steps.shard.outputs.n }}
          case "${{ steps.shard.outputs.kind }}" in
            unit)
              pnpm turbo run test --only --continue --concurrency=2 $(node .github/scripts/ci-shard.mjs unit "$i" "$n") ;;
            cli)
              pnpm turbo run test --only --filter=@maycombhq/cli -- $(node .github/scripts/ci-shard.mjs cli "$i" "$n") ;;
            journeys)
              pnpm turbo run test --only --filter=@maycombhq/journeys -- $(node .github/scripts/ci-shard.mjs journeys "$i" "$n") ;;
          esac
        shell: bash
      # Kept when tests failed too: turbo stores only the packages that passed.
      - if: always() && steps.tests.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .turbo/test
          key: turbo-test-${{ runner.os }}-node${{ matrix.node }}-${{ steps.shard.outputs.name }}-${{ steps.shard.outputs.tree }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The speed budgets run alone on their runner, as `pnpm test` runs them: beside other tests they
  # measure the machine's load, not Atticus.
  speed:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest became 26.04, where Playwright 1.56 has no Chromium to install.
        os: [ubuntu-24.04, windows-latest]
        node: ${{ github.event_name == 'workflow_dispatch' && inputs.full && fromJSON('[22,24]') || fromJSON('[22]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/build
          key: turbo-build-${{ runner.os }}-node${{ matrix.node }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-node${{ matrix.node }}-
      - run: pnpm build
      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
        shell: bash
      # Kept for the same tree only, as in the test job.
      - uses: actions/cache/restore@v4
        with:
          path: .turbo/test
          key: turbo-test-${{ runner.os }}-node${{ matrix.node }}-speed-${{ steps.tree.outputs.tree }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: turbo-test-${{ runner.os }}-node${{ matrix.node }}-speed-${{ steps.tree.outputs.tree }}-
      # The M5 exit's speed budgets (m5-exit).
      - id: m5
        env:
          TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/test
        run: pnpm turbo run test --only --filter=@maycombhq/m5-exit --concurrency=1
      # Home's speed (beta.23): beside the other tests a 2-CPU runner measured 2 s for a load that
      # takes 0.3 s.
      - run: pnpm --filter @maycombhq/cli run test:speed
      - if: always() && steps.m5.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .turbo/test
          key: turbo-test-${{ runner.os }}-node${{ matrix.node }}-speed-${{ steps.tree.outputs.tree }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The offline install bundle, built and installed the way a person would, on Linux and
  # Windows (install.sh and install.ps1), when the full matrix runs.
  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest became 26.04, where Playwright 1.56 has no Chromium to install.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # ADR 0124 addendum D-bundle: the default bundle leaves the embedding plugin out.
      - run: pnpm bundle
      - run: node scripts/bundle/test-bundle.mjs dist/atticus-*-offline.zip
        shell: bash
      # ADR 0116 addendum: the embedding model and this platform's onnxruntime, each checked
      # against its committed sha256, kept between runs so they are downloaded once. pnpm bundle
      # --with-embeddings fills the packages from this cache; the other jobs never fetch them.
      - uses: actions/cache@v4
        with:
          path: .cache/pinned
          key: pinned-${{ runner.os }}-${{ hashFiles('packages/*/pins.json') }}
      - run: node scripts/model/fetch.mjs --this-platform
      # ADR 0124 addenda D-npm and D-npm2: the nine public packages packed (the model and onnxruntime
      # filled from the cache above), served by a throwaway mirror, npm install -g @maycombhq/atticus
      # with scripts off, then used with the network blocked: doctor says the model is ready, it
      # searches by meaning, and the app answers.
      - if: runner.os == 'Linux'
        run: pnpm npm:test
      - run: pnpm bundle --with-embeddings
      - run: node scripts/bundle/test-bundle.mjs dist/atticus-*-offline-embeddings.zip
        shell: bash
      # The embeddings plugin zip, installed next to the default bundle; its fetch step takes the
      # pinned files from the cache above, offline, and the install then searches by meaning.
      - run: pnpm bundle --embeddings-plugin
      - run: node scripts/bundle/test-bundle.mjs dist/atticus-*-offline.zip --plugin dist/atticus-*-embeddings-plugin.zip --plugin-from .cache/pinned
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: atticus-offline-${{ matrix.os }}
          path: dist/*-offline*.zip*

  # The one result to require: it fails unless every job above passed (the bundle may be skipped).
  check:
    if: always()
    needs: [lint, test, speed, bundle]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "lint ${{ needs.lint.result }}, test ${{ needs.test.result }}, speed ${{ needs.speed.result }}, bundle ${{ needs.bundle.result }}"
          exit 1
      - run: echo "every job passed"
