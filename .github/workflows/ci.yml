name: CI

# Every push runs the check once on Linux. The full matrix (Linux and Windows, Node 22 and 24)
# runs when started by hand (Actions > CI > Run workflow, full: true) and before a release:
# hosted minutes on a private repo are limited, and Windows minutes count double.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full matrix (Linux and Windows, Node 22 and 24)"
        type: boolean
        default: true

permissions:
  contents: read

# A newer push cancels the run for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.full && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        node: ${{ github.event_name == 'workflow_dispatch' && inputs.full && fromJSON('[22,24]') || fromJSON('[22]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The role journeys drive the app in Chromium.
      - run: pnpm --filter @maycombhq/journeys exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm denylist
      - run: pnpm lint
      - run: pnpm typecheck
      # Windows runners are slower; fewer packages testing at once keeps timing-sensitive tests honest.
      - run: pnpm turbo run test --concurrency=${{ matrix.os == 'windows-latest' && '2' || '10' }}

  # The offline install bundle, built and installed the way a person would, on Linux and
  # Windows (install.sh and install.ps1), when the full matrix runs.
  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle
      - run: node scripts/bundle/test-bundle.mjs dist/atticus-*-offline.zip
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: atticus-offline-${{ matrix.os }}
          path: dist/*-offline.zip*
