name: Publish to npm

# ADR 0124 addendum D-npm: when a GitHub release is published, every Atticus package that isn't
# private goes to npm under the maycombhq scope, the model's and onnxruntime's packages carrying
# their bytes. First the bank-style install test (pnpm npm:test: pack, a throwaway mirror,
# npm install -g with scripts off, search by meaning with the network blocked), then
# pnpm release:npm (the pack check, then pnpm -r publish). Started by hand, it can be a dry run.
# Needs the NPM_TOKEN secret (an npm automation or granular token that may publish to the
# maycombhq scope). Provenance: set the repository variable NPM_PROVENANCE to true (npm accepts
# provenance only from a public repository). docs/guide/admin.md, Publishing to npm.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack, check and test, then pnpm publish --dry-run (nothing is uploaded)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance, when NPM_PROVENANCE is true

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The model and onnxruntime, each checked against its committed sha256, kept between runs.
      # Every package's prepack fills from this cache offline and refuses a missing or wrong file.
      - uses: actions/cache@v4
        with:
          path: .cache/pinned
          key: pinned-${{ runner.os }}-${{ hashFiles('packages/*/pins.json') }}
      - run: pnpm model:fetch
      - run: pnpm licences
      - run: pnpm npm:test
      - run: pnpm release:npm ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_PROVENANCE == 'true' && 'true' || 'false' }}
