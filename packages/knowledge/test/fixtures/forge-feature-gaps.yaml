# Knowledge gaps about the Forge features (ADR 0031), with the four features detection finds
# (packages/features/test/fixtures/forge-features.yaml) added to the expected catalog.
# Hand-written ground truth: never generate it from the checks' output.
#
# Each question goes to the feature's owner, else the owner of the system where its first
# entry point starts work: the balance starts in the portal, the job in reports, the
# payment event and the transfer call in the ledger. Order: check, then feature id.
- check: feature-flow-complete
  system: ledger
  owner: team-ledger
  records: [feature.payments, if-32d38aecd11b86b1]
  question: Where does Payments (feature.payments) really start or end? Nothing Atticus found makes portal-bff publish payments.initiated.
  neededFact: what starts or ends the flow of feature.payments at if-32d38aecd11b86b1
- check: feature-flow-complete
  system: ledger
  owner: team-ledger
  records: [feature.transfers, if-d99f508a2ac9b6e0]
  question: Where does Transfers (feature.transfers) really start or end? Nothing Atticus found makes portal-bff call POST /transfers.
  neededFact: what starts or ends the flow of feature.transfers at if-d99f508a2ac9b6e0

