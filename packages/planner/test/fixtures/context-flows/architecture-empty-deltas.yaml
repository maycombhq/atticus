# The shape the live dogfood showed: one flow that really changes, and four flows the change
# only relies on, each written as "modify" with no step.
flows:
  - flow: forge-orders.place-order
    repo: forge-orders
    change: modify
    why: The order is screened before stock is reserved.
    steps:
      - op: add
        after: 1
        kind: call-out
        what: Northwind Pay screens the order for fraud
        to: { component: northwind-pay, entry: "POST /v1/screenings", new: true }
        fields: { sends: [sku, quantity, cardToken], returns: [verdict] }
      - op: add
        after: 1
        kind: branch
        what: A rejected order is refused with 422 and nothing is reserved
        fields: { reads: [verdict] }
      - op: change
        step: 4
        kind: write
        what: The order is inserted with the screen's verdict
        store:
          {
            table: forge-orders-db.orders,
            columns: [sku, quantity, fraud_verdict],
            types: { fraud_verdict: varchar(20) },
            classification: { fraud_verdict: internal },
            migration: V4__add_fraud_verdict.sql,
          }
  - flow: forge-stock.reserve-stock
    repo: forge-stock
    change: modify
    why: No step changes; stock is reserved only after the screen passes.
    steps: []
  - flow: forge-orders.cancel-order
    repo: forge-orders
    change: modify
    why: No step changes; a refused order is never saved, so it can't be cancelled.
    steps: []
  - flow: forge-orders.list-orders
    repo: forge-orders
    change: modify
    why: No step changes; the list reads the same orders rows as step 4 writes.
    steps: []
  - flow: forge-stock.release-stock
    repo: forge-stock
    change: modify
    why: No step changes; a refused order reserves nothing to release.
    steps: []
