# What a reader scan of the two invented Forge repos read before the assistant's facts (ADR
# 0124, A3b): raw records, merged by the tests as a scan merges them into catalog/generated.
# forge-notify's records must come through a write of forge-ledger's facts unchanged; the
# reader's forge-ledger records are replaced by the projected facts (DELETE /accounts/{id} is
# one the facts don't have, so it goes); the notifier's call into the ledger keeps its caller.
- kind: Component
  id: notify-api
  confidence: verified
  system: messaging
  repo: forge-notify
  type: service
  evidence:
    - { source: code, repo: forge-notify, path: build.gradle, line: 1, commit: 9f8e7d6 }
- kind: Endpoint
  id: notify-api.post-notify
  confidence: verified
  component: notify-api
  endpointType: rest
