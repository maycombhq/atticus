# Features a correct detection finds in the Forge catalog (fixtures/forge/expected/scan.yaml),
# ADR 0031. Hand-written ground truth, written before the detector: never generate it from
# the detector's output.
#
# Rows omit schemaVersion and status: current; the test adds them. entryPoints start with
# the outermost entry point (the one no other entry point's flow reaches), then the rest in
# id order; records are sorted by id; evidence is the entry points' evidence, compared as a
# set of (repo, path, line, side).
#
# Why each feature is what it is:
# - Account balance: the UI calls the BFF's balance endpoint, the BFF calls the ledger's
#   balance endpoint through the gateway (the call shares "balance" with where the flow
#   started), and the ledger reads the account table (shares "account" with the call). The
#   BFF's transfer call, audit call and payment event share nothing with "balance", so they
#   are not part of this flow. The longest resource wins the name: /accounts/{id}/balance.
# - Transfers: POST /transfers through the gateway; the ledger writes the entry table (no
#   table shares a word with "transfers", and account is claimed by the balance call, so the
#   one it writes that nobody claims is taken), and publishes transfers.completed (shares
#   "transfers"), which reports-job consumes. That consumer is an entry point of its own
#   (an event from another system), and is in this flow, so it joins this feature.
# - Payments: the payments.initiated event from the portal starts work in the ledger, which
#   calls Northwind Pay (shares "payments") and writes the entry table nobody claims.
# - Daily entries report: reports-job is a batch job (its own entry point); its class is
#   DailyEntriesJob and its system is Reports; it reads the entry table (shares "entries").
- kind: Capability
  id: feature.account-balance
  confidence: inferred
  name: Account balance
  namedBy: detected
  entryPoints: [portal-bff.get-balance, ledger-api.get-balance]
  records:
    - if-75b5e8d8aa780837
    - if-f5c8b4b06d75284f
    - ledger-api
    - ledger-api.get-balance
    - ledger-db.account
    - portal-bff
    - portal-bff.get-balance
    - portal-ui
  evidence:
    - { source: code, repo: forge-portal-bff, path: src/main/java/forge/portal/BalanceController.java, line: 12, side: callee }
    - { source: code, repo: forge-ledger, path: src/main/java/forge/ledger/LedgerEndpoints.java, line: 8, side: callee }
    - { source: spec, repo: forge-ledger, path: api/ledger-openapi.yaml, line: 6, side: definition }

- kind: Capability
  id: feature.daily-entries-report
