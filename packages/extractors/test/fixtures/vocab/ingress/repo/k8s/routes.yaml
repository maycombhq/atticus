apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop-prod
spec:
  template:
    metadata:
      labels: { app: orders }
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
  namespace: shop-prod
spec:
  selector: { app: orders }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gw
  namespace: shop-prod
spec:
  gatewayClassName: shared
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: shop-prod
spec:
  parentRefs:
    - name: public-gw
  hostnames: [api.harbor.example]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /orders }
      backendRefs:
        - name: orders-svc
          port: 8080
