apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
      hosts:
        - api.harbor.example
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - plain.harbor.example
