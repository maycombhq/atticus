# Hand-written: what the migrations extractor must produce for fixtures/data/allowed-values
# (component boards-api, system boards, no datasource config, so the store is boards-db).
# A column's allowed values are a fact the migration states, cited to the line that states
# them: a CHECK (column IN (...)) on the column or the table, one added by ALTER TABLE, an
# ENUM(...) column type, or a type made by CREATE TYPE ... AS ENUM. A check dropped by a later
# migration (DROP CONSTRAINT) is gone from the latest state. Defaults stay as they were read.
- kind: DataStore
  id: boards-db
  confidence: verified
  storeType: unknown
  ownerComponent: boards-api
  entitiesHeld: []
  evidence: [{ source: migration, path: db/migration/V1__boards.sql, line: 1 }]

- kind: Migration
  id: boards-db.v1
  confidence: verified
  dataStore: boards-db
  version: "1"
  tool: flyway
  file: db/migration/V1__boards.sql
  operations: [create type pin_colour, create table board_pin]
  evidence: [{ source: migration, path: db/migration/V1__boards.sql, line: 1 }]
- kind: Migration
  id: boards-db.v2
  confidence: verified
  dataStore: boards-db
