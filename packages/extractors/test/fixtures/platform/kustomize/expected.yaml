      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/components/tracing/kustomization.yaml, line: 4 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/deployment-patch.yaml, line: 1 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/kustomization.yaml, line: 23 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/kustomization.yaml, line: 19 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/hpa.yaml, line: 2 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/kustomization.yaml, line: 6 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/network-policy.yaml, line: 2 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/prod/kustomization.yaml, line: 7 }
    component: tide-ledger
    env: prod
    platform: kubernetes
    replicas: 4
    resources: { cpu: "1", memory: 1Gi }
    autoscaling: { min: 4, max: 12 }
    networkPolicies: [ ledger-allow-gateway ]
  - kind: Setting
    id: tide-ledger.dev.env-audit-enabled
