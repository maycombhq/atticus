# Expected output of the openshift extractor over ./repo (repo "tide-ledger-deploy", type infra).
# Each overlay is built without running kustomize (ADR 0064). dev: namePrefix dev-, namespace
# tide-dev, a new image tag and a merged ConfigMap literal. prod: a component adds an env var
# (JSON 6902), a strategic-merge patch changes DB_HOST and limits, images renames the image,
# replicas sets 4, and the HPA and NetworkPolicy of the overlay apply. qa has only a remote base.
records:
  - kind: Deployment
    id: tide-ledger.dev
    confidence: verified
    evidence:
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/base/deployment.yaml, line: 2 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/base/kustomization.yaml, line: 4 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/dev/kustomization.yaml, line: 6 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/dev/kustomization.yaml, line: 4 }
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/overlays/dev/kustomization.yaml, line: 8 }
    component: tide-ledger
    env: dev
    platform: kubernetes
    replicas: 1
    resources: { cpu: 250m, memory: 256Mi }
    networkPolicies: []
  - kind: Deployment
    id: tide-ledger.prod
    confidence: verified
    evidence:
      - { source: infrastructure, repo: tide-ledger-deploy, path: apps/ledger/base/deployment.yaml, line: 2 }
