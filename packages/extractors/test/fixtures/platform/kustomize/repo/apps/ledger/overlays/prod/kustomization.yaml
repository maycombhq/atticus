apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tide-prod
resources:
  - ../../base
  - hpa.yaml
  - network-policy.yaml
components:
  - ../../components/tracing
patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: tide-ledger
images:
  - name: registry.tide.example/ledger/api
    newName: registry.tide.example/ledger/api-hardened
    newTag: 1.0.4
replicas:
  - name: tide-ledger
    count: 4
replacements:
  - source:
      kind: ConfigMap
      name: ledger-config
      fieldPath: data.LEDGER_CURRENCY
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - metadata.annotations.currency
