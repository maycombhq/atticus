# Expected output of the openshift extractor over ./repo (repo "forge-storefront-deploy", type infra).
# The chart is read without running Helm (ADR 0064): one set of records per values-<env>.yaml file,
# layered over values.yaml. The release is named after the chart, so fullname is "storefront".
# prod: autoscaling is on, so the template leaves replicas out and the HPA gives min and max; the
# cart subchart is on. uat: cart.enabled is false, so no cart. FEATURE_FLAGS (tpl) and the
# checksum annotation (sha256sum) are template forms Atticus does not evaluate: left out.
records:
  - kind: Deployment
    id: cart.prod
    confidence: verified
    evidence:
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/charts/cart/templates/deployment.yaml, line: 2 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/charts/cart/values.yaml, line: 3 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/values.yaml, line: 42 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/values-prod.yaml, line: 33 }
    component: cart
    env: prod
    platform: kubernetes
    replicas: 2
    networkPolicies: []
  - kind: Deployment
    id: storefront.prod
    confidence: verified
    evidence:
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/templates/deployment.yaml, line: 2 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/values.yaml, line: 5 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/values-prod.yaml, line: 4 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/templates/hpa.yaml, line: 3 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/values.yaml, line: 9 }
      - { source: infrastructure, repo: forge-storefront-deploy, path: deploy/storefront/values-prod.yaml, line: 25 }
    component: storefront
    env: prod
    platform: kubernetes
    resources: { cpu: "1", memory: 1Gi }
