warnings:
  - path: deploy/storefront/Chart.yaml
    message: Chart dependency forge-common (https://charts.forge.example/stable) is not in the repo; its templates are not read.
  - path: deploy/storefront/templates/pdb.yaml
    message: "Could not read this Helm template at line 2: a condition depends on an unknown value. Its objects are not read."
  - path: deploy/storefront/templates/worker.yaml
    message: "Skipped a Deployment: its name comes from a template form Atticus doesn't evaluate."
