apiVersion: batch/v1
kind: CronJob
metadata:
  name: reports-job-nightly
  namespace: forge-prod
  labels:
    app: reports-job
spec:
  schedule: "30 1 * * *"
  timeZone: Europe/London
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: reports-job
              image: registry.example.com/forge/reports-job:0.9.0
              resources:
                limits:
                  cpu: 250m
                  memory: 256Mi
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: statement-export
  namespace: forge-prod
spec:
  schedule: "0 6 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: statement-export
              image: registry.example.com/forge/statement-export:3.1.0
