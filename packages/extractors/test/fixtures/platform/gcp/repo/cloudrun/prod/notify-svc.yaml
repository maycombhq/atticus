apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: notify-svc
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
        - image: europe-docker.pkg.dev/forge/notify-svc:2.0.1
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
