apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-gateway
  namespace: forge-prod
spec:
  podSelector:
    matchLabels:
      tier: backend
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: forge-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: forge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal
  namespace: forge-prod
spec:
  podSelector:
    matchLabels:
      app: portal-bff
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: other-namespace
  namespace: forge-uat
spec:
  podSelector: {}
