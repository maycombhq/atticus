trigger:
  branches:
    include:
      - main
      - release/*
pr:
  - main
schedules:
  - cron: "0 3 * * 1"
    displayName: Weekly scan
    branches:
      include: [main]

stages:
  - stage: Build
    jobs:
      - job: build
        steps:
          - task: Maven@3
            displayName: Build and test
            inputs:
              goals: clean verify
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "**/surefire-reports/TEST-*.xml"
          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: "**/jacoco.xml"
  - template: .azure-pipelines/deploy-stage.yml
    parameters:
      env: uat
  - template: .azure-pipelines/deploy-stage.yml
    parameters:
      env: prod
  - template: deploy.yml@platform-templates
