name: Ledger CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: ./mvnw -B test
      - name: Coverage
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://ledger.staging.forge.example
    steps:
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ledger-api
