# The IntelliJ IDEA the plugin is built against. Override with -Patticus.ideaPath=<folder>
# (or in ~/.gradle/gradle.properties). When the folder is missing, IntelliJ IDEA Community is
# downloaded instead (about 1 GB).
atticus.ideaPath=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2.0.1

# The IDE has its own Kotlin standard library; the plugin doesn't ship one.
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# One process for the build: less memory on a small machine.
kotlin.compiler.execution.strategy=in-process
