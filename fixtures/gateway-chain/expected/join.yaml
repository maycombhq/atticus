# What joinFacts gives for the six repos' facts (ADR 0124 addendum A-gateway2), derived by hand
# from them: the shop's read and its dispatch go through the edge gateway's routes (the dispatch
# rewritten to /dispatch), and the orders service's charge goes out through two gateways, the
# internal edge one and then the external partner one, to land on Northwind Pay's POST /v2/charges.
# Each hop keeps its own auth, the scopes its route demands and which side it faces; the two loop
# proxies forward into each other, so each call into the ring is asked instead of walked.
