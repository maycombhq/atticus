# Generated by Atticus from the org pack. Do not edit; change org-pack/process and regenerate.
name: org-flow
version: 2
description: Atticus 2 change flow - proposal (feature) → design (architecture) → stories → specs, tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: "Why the change is needed and what it changes: the brief placed against the estate"
    template: proposal.md
    instruction: |
      Generated by the feature stage (atticus change feature) from brief.md and feature.yaml;
      edit feature.yaml and run the stage again, never proposal.md. brief.md is the product owner's source:
      add no scope it does not ask for, and raise anything unclear as a question to its owner.

      - Why: the problem in the brief, in one or two sentences.
      - What Changes: the feature in plain words, each flow it changes, and each new flow.
      - Capabilities: the flows the change adds or changes; each becomes specs/<capability>/spec.md.
      - Impact: the repos and systems the flows run in, and the gaps that need decisions.
      - Open questions: what the brief leaves undecided.
    requires: []
  - id: design
    generates: design.md
    description: "How the change is built: target flows, interface and data changes, deploy order, rollout and rollback"
    template: design.md
    instruction: |
      Generated by the architecture stage (atticus change architecture) from target-flows/;
      edit the target flows and run the stage again. Every step of a target flow is placed in the code it
      changes (at), the new file it creates (new) or the code it calls (uses), cited from verified facts.

      design.md covers: each target flow and what it changes; the flows read unchanged; interface changes
      with their consumers; data changes with their migrations; the deploy order across repos; and Rollout
      and rollback: how each store write and migration is undone, or why it needs no undo (an expand-only
      migration), and what happens to rows written in between.
    requires:
      - proposal
  - id: stories
    generates: stories.md
    description: Index of user stories; each story lives in stories/<story-id>.md
    template: stories.md
    instruction: |
      Generated by the stories stage (atticus plan stories): one story per target flow, at
      stories/<story-id>.md, and stories.md as the index. A story says who wants what and why, its tasks
      (each once: where the code goes, the files, the criteria that accept it), its acceptance criteria in
      Given/When/Then form, its interface and data changes, non-functional needs, tests, dependencies and
      definition of done. Each task's prompt for Copilot or Claude Code is a file of its own,
      tasks/<story>.<task>.prompt.md. A story without acceptance criteria is not ready.
    requires:
      - design
  - id: specs
    generates: specs/**/*.md
    description: Behaviour the change adds, modifies or removes, as OpenSpec delta specs generated from the stories
    template: specs.md
    instruction: |
      Generated by the stories stage from the stories' acceptance criteria, with no model
      call: one capability per flow (specs/<capability>/spec.md), a requirement per story with SHALL
      wording, and a scenario per criterion (WHEN/THEN). A capability already in openspec/specs is
      MODIFIED, carrying its archived scenarios; a removed flow's requirements are REMOVED. The stage
      runs openspec validate --strict on them; edit the stories, never the specs.
    requires:
      - stories
  - id: tasks
    generates: tasks.md
    description: Implementation checklist grouped by repo, numbered per story
    template: tasks.md
    instruction: |
      Generated by the stories stage: one "## <repo-id>" heading per repo, and under it a
      checkbox "- [ ] <story>.<task> <title> (story <story-id>)" per task, numbered per story without gaps,
      each small enough for one pull request. Tick a task when its tests pass; openspec counts the boxes.
    requires:
      - stories
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Run one task at a time with atticus task <change> <task>, in the change's worktrees, in task order. Tick each task in tasks.md when its tests pass. Stop and ask when a task conflicts with the specs or design.
