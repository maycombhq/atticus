# The target of flow proxy-core-v1.lock-card (ADR 0087): the steps this change adds, changes or removes. Drafted by atticus change architecture; base pins the version of today's flow it was written against (ADR 0111).
schemaVersion: 2
flow: proxy-core-v1.lock-card
repo: forge-proxy-core-v1
change: new
name: Forward card lock through the core gateway
trigger:
  kind: endpoint
  what: The gateway forwards a card lock
  entry: PUT /forge/core/v1/cards/{id}/lock
why: The proxy forwards only /cards/*/pin under /cards today.
steps:
  - op: add
    after: 0
    at: apiproxy/proxies/default.xml:17
    kind: entry
    what: Matches PUT /cards/*/lock in a new LockCard flow.
    fields:
      from:
        - id
    why: A new proxy flow is needed for the lock route.
  - op: add
    after: 0
    at: apiproxy/proxies/default.xml:17
    kind: call-out
    what: Forwards the lock to the card vault through core-backend.
    to:
      component: card-vault
      entry: PUT /cards/{id}/lock
      new: true
    fields:
      sends:
        - id
    why: The card vault holds the lock.
