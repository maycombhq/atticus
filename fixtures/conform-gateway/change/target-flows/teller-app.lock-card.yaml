# The target of flow teller-app.lock-card (ADR 0087): the steps this change adds, changes or removes. Drafted by atticus change architecture; base pins the version of today's flow it was written against (ADR 0111).
schemaVersion: 2
flow: teller-app.lock-card
repo: forge-teller-app
change: new
name: Lock a card from the teller app
trigger:
  kind: action
  what: A teller locks a customer's card
  entry: lock card
why: The teller app has no call that locks a card; only the card team unlocks, so there is no unlock.
steps:
  - op: add
    after: 0
    at: src/main/java/forge/teller/TellerClient.java:25
    kind: entry
    what: The teller picks the customer's card and asks to lock it.
    fields:
      from:
        - id
    why: The teller starts the lock.
  - op: add
    after: 0
    at: src/main/java/forge/teller/TellerClient.java:25
    kind: call-out
    what: Calls the core gateway to lock the card.
    to:
      component: proxy-core-v1
      entry: PUT /forge/core/v1/cards/{id}/lock
      new: true
    fields:
      sends:
        - id
    why: The gateway is how the teller app reaches core services.
