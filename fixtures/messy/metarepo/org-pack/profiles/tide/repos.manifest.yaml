# Tidewater's repos (messy-estate fixture). Hand-written; matches fixtures/messy/repos.
schemaVersion: 1
platform: tide
repos:
  - id: tide-cards
    url: https://git.example.com/tide/tide-cards.git
    type: spring-boot
    owner: team-cards
    component: cards-svc
    system: cards
  - id: tide-payments
    url: https://git.example.com/tide/tide-payments.git
    type: spring-boot
    owner: team-payments
    component: payments-svc
    system: payments
    hosts: [payments.tide.internal]
  - id: tide-gateway
    url: https://git.example.com/tide/tide-gateway.git
    type: gateway
    owner: team-platform
    system: gateway
    hosts: [api-gw.tide.internal]
  - id: tide-web
    url: https://git.example.com/tide/tide-web.git
    type: spa
    owner: team-web
    component: web
    system: web
  - id: tide-bff
    url: https://git.example.com/tide/tide-bff.git
    type: node
    owner: team-web
    component: web-bff
    system: web
    hosts: [web-bff.tide.internal]
  - id: tide-infra
    url: https://git.example.com/tide/tide-infra.git
    type: terraform
    owner: team-platform
    system: platform
    dialects: [tide-infra]
  - id: tide-accounts
    url: https://git.example.com/tide/tide-accounts.git
    type: spring-boot
    owner: team-accounts
    system: accounts
