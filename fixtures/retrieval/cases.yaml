# Retrieval cases for the context engine's eval (packages/evals, context-bench: runRetrievalBench).
# Each case is a step's input (title and text) and what a correct context must hold: record or
# node ids, or {text: ...} for a sentence that must be in what is sent (a document's or a wiki
# section's words). Written by hand from the fixtures; never generate it from the index.
#
# Roots:
#   forge: fixtures/forge/expected/scan.yaml + catalog-extra.yaml + curated.yaml + distractors.yaml
#          + the forge-wiki page in knowledge/ + documents/settlement-runbook-docx as inputs/.
#   shop:  fixtures/stages with fixtures/context laid over it (the index tests' root).
#
# Groups:
#   identifier  the input says the words a camelCase or PascalCase name is made of
#   paraphrase  the input avoids the record's own words
#   synonym     the input uses a glossary term's other name (a curated alias)
#   multi-hop   the record is two links from anything the input names
#   distractor  similar records of other systems compete
#   document    the fact is only in an ingested document's section
#   long-wiki   the sentence is deep inside a long wiki section
#   exact       the input names the record (id, name, alias or endpoint)
#   no-answer   nothing in the estate answers it
