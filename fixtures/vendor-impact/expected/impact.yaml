# What Northwind Pay API 2.0.0 does to the estate, written by hand before the code (ADR 0130).
# For each change: the partner gateway's forwarding calls that reach the operation (matched to
# 1.0.0, what they call today), the service calls that go through each route, and on up the chain.
vendor: northwind-pay
older:
  id: doc.northwind-pay-openapi-v1
  path: inputs/partner-specs/northwind-pay-openapi-v1.yaml
  version: 1.0.0
newer:
  id: doc.northwind-pay-openapi-v2
  path: inputs/partner-specs/northwind-pay-openapi-v2.yaml
  version: 2.0.0
changes:
  - id: field-renamed.post-charges.request.reference
    severity: breaking
    says: "POST /charges: the request field reference is now merchantReference; a caller that still sends reference no longer sets it."
    forwards:
      - call:
          { repo: forge-partner-gateway, fact: call.post.v1-charges, component: partner-gateway, at: "proxies/northwind-pay-v1/apiproxy/proxies/default.xml:5" }
        route:
          { repo: forge-partner-gateway, fact: entry.post.partners-northwind-charges, component: partner-gateway, at: "proxies/northwind-pay-v1/apiproxy/proxies/default.xml:5" }
        tie:
          { repo: forge-partner-gateway, fact: config.targetserver.northwind-pay, component: partner-gateway, at: "environments/prod/targetservers.json:4" }
        operation: northwind-pay.post-charge
        callers:
          - call:
              { repo: forge-billing, fact: call.post.partners-northwind-charges, component: billing-api, at: "src/main/java/forge/billing/NorthwindClient.java:15" }
            interface: if-f58bce6a7580e064
            field: { uses: sends, at: "src/main/java/forge/billing/ChargeRequest.java:5" }
            under:
              { repo: forge-billing, fact: entry.post.invoices-id-pay, component: billing-api, at: "src/main/java/forge/billing/InvoicesController.java:13" }
            upstream:
              - call:
                  { repo: forge-shop-bff, fact: call.post.invoices-id-pay, component: shop-bff, at: "src/main/java/forge/shop/CheckoutController.java:16" }
                interface: if-88a31c9267d4d8ff
                reaches:
                  { repo: forge-billing, fact: entry.post.invoices-id-pay, component: billing-api, at: "src/main/java/forge/billing/InvoicesController.java:13" }
                under:
                  { repo: forge-shop-bff, fact: entry.post.checkout, component: shop-bff, at: "src/main/java/forge/shop/CheckoutController.java:14" }
  - id: operation-removed.post-charges-chargeid-capture
    severity: breaking
    says: "POST /charges/{chargeId}/capture is gone in 2.0.0; a call to it will fail."
    forwards:
      - call:
          { repo: forge-partner-gateway, fact: call.post.v1-charges-chargeid-capture, component: partner-gateway, at: "proxies/northwind-pay-v1/apiproxy/proxies/default.xml:8" }
        route:
          { repo: forge-partner-gateway, fact: entry.post.partners-northwind-charges-chargeid-capture, component: partner-gateway, at: "proxies/northwind-pay-v1/apiproxy/proxies/default.xml:8" }
        tie:
          { repo: forge-partner-gateway, fact: config.targetserver.northwind-pay, component: partner-gateway, at: "environments/prod/targetservers.json:4" }
        operation: northwind-pay.post-capture
        callers:
          - call:
              { repo: forge-billing, fact: call.post.partners-northwind-charges-chargeid-capture, component: billing-api, at: "src/main/java/forge/billing/NorthwindClient.java:19" }
            interface: if-c804394bfd01dd5d
            under:
              { repo: forge-billing, fact: entry.post.invoices-id-settle, component: billing-api, at: "src/main/java/forge/billing/InvoicesController.java:18" }
            upstream: []
  - id: field-required.post-charges-chargeid-refunds.request.reason
    severity: breaking
    says: "POST /charges/{chargeId}/refunds: the request field reason is now required; a caller that leaves it out is refused."
    forwards:
      - call:
          { repo: forge-partner-gateway, fact: call.post.v1-charges-chargeid-refunds, component: partner-gateway, at: "proxies/northwind-pay-v1/apiproxy/proxies/default.xml:11" }
        route:
          { repo: forge-partner-gateway, fact: entry.post.partners-northwind-charges-chargeid-refunds, component: partner-gateway, at: "proxies/northwind-pay-v1/apiproxy/proxies/default.xml:11" }
        tie:
          { repo: forge-partner-gateway, fact: config.targetserver.northwind-pay, component: partner-gateway, at: "environments/prod/targetservers.json:4" }
        operation: northwind-pay.post-refund
        callers:
          - call:
              { repo: forge-billing, fact: call.post.partners-northwind-charges-chargeid-refunds, component: billing-api, at: "src/main/java/forge/billing/NorthwindClient.java:23" }
            interface: if-dcf1176ce394baa4
            field: { uses: does-not-send }
            under:
              { repo: forge-billing, fact: entry.post.invoices-id-refund, component: billing-api, at: "src/main/java/forge/billing/InvoicesController.java:23" }
            upstream: []
  - id: operation-added.get-charges
    severity: additive
    says: "GET /charges is new in 2.0.0; no caller has to change."
    forwards: []
repos: [forge-billing, forge-partner-gateway, forge-shop-bff]
systems: [billing, northwind-pay, platform, shop]
flows:
  - { id: billing-api.pay-invoice, repo: forge-billing }
  - { id: billing-api.refund-invoice, repo: forge-billing }
  - { id: shop-bff.checkout, repo: forge-shop-bff }
interfaces: [if-88a31c9267d4d8ff, if-c804394bfd01dd5d, if-dcf1176ce394baa4, if-f58bce6a7580e064]
endpoints: [northwind-pay.post-capture, northwind-pay.post-charge, northwind-pay.post-refund]
gaps: []
asks: []
