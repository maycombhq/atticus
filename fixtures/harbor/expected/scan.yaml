# Expected catalog from scanning fixtures/harbor/repos plus the partner specs in inputs/,
# written in the catalog vocabulary of ADR 0040 (GraphQL, gRPC, webhook and function
# endpoints, via mesh and webhook, schedules as settingKind schedule, ingress on deployments,
# data-pipeline and ml-model components, warehouse, feature-store, object-storage and queue
# stores, SaaS vendors tagged saas).
# Hand-written ground truth. Do not generate it from extractor output.
# Records omit `schemaVersion` and `status: current`; the tests add them.
# Records marked "pending:" need a producer that is not on main yet; packages/harbor-tests
# lists them (test/pending.ts) and skips their assertions until the producer lands.

