apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-svc
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-svc
  template:
    metadata:
      labels:
        app: payments-svc
    spec:
      containers:
        - name: payments-svc
          image: registry.harbor.example/payments-svc:4.1.0
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
