apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-svc
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-svc
  template:
    metadata:
      labels:
        app: orders-svc
    spec:
      containers:
        - name: orders-svc
          image: registry.harbor.example/orders-svc:7.0.3
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
