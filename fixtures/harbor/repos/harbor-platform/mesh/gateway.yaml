apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: harbor-public
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: harbor-public-tls
      hosts:
        - api.harbor.example
        - orders.internal.harbor.example
