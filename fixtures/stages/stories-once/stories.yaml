# A one-field change (ADR 0124 addendum B-once): an order may say the date it must arrive by.
# The field deliverBy flows through the entry, a new validation, the write (as the column
# deliver_by) and the response, so each of the four tasks carries it. storiesFromDeltas's output,
# as data, so the checks, the story file and the bench draft are tested without an estate.
# Invented: the Forge estate.
