# The story writer's answer for the deliverBy change with each behaviour written once (ADR 0124
# addendum B-once): on the task whose code it exercises first, with `also` naming the other
# tasks it accepts. The same story as repeated.yaml in 4 criteria instead of 8. Invented: the
# Forge estate.
stories:
  - id: s1-deliver-by
    title: Say when an order must arrive
    asA: client
    iWant: to give the date my order must arrive by
    soThat: the warehouse ships it in time
    scope:
      in: []
      out:
        - Orders placed before the change have no deliverBy
    interfaces:
      - entry: POST /orders
        change: changed
        breaking: false
        why: deliverBy is optional, so today's clients still work.
        fields:
          - { name: deliverBy, side: request, type: date, required: false, change: added, validation: "a date (YYYY-MM-DD) after today" }
          - { name: deliverBy, side: response, type: date, required: false, change: added }
    data:
      - table: forge-orders-db.orders
        column: deliver_by
        type: date
        nullable: true
        change: added
        migration: V5__add_deliver_by.sql
        classification: internal
        retention: as long as the order row
    nonFunctional:
      auth: POST /orders is called as today.
      audit: Nothing new is recorded; deliver_by is kept on the order.
      timeouts: No new call.
      performance: One more column per insert; no new index.
    tests:
      - OrderControllerTest gains an order with deliverBy, a malformed deliverBy (400) and a past deliverBy (400)
    dependencies:
      stories: []
      repos: []
      notes:
        - The V5 migration runs before forge-orders is released
    tasks:
      - id: "1.1"
        criteria:
          - text: "Given a client, when it posts an order with deliverBy 2026-11-02, then 201 returns deliverBy 2026-11-02 and the orders row holds deliver_by 2026-11-02"
            checks: [deliverBy, deliver_by]
            entry: POST /orders
            also: ["1.2", "1.3", "1.4"]
          - text: "Given a client, when it posts an order with deliverBy \"next week\", then 400 says deliverBy must be a date and no order is saved"
            checks: [deliverBy]
            outcome: error
            entry: POST /orders
            validation: deliverBy is a date (YYYY-MM-DD)
            rule: format
            status: 400
            also: ["1.2"]
      - id: "1.2"
        criteria:
          - text: "Given today is 2026-10-25, when a client posts an order with deliverBy 2026-10-20, then 400 says deliverBy must be after today and no order is saved"
            checks: [deliverBy]
            outcome: error
            entry: POST /orders
            validation: deliverBy is after today
            rule: range
            status: 400
      - id: "1.3"
        criteria:
          - text: "Given the insert fails, when a client posts an order with deliverBy 2026-11-02, then 500 and no orders row holds it"
            outcome: error
            entry: POST /orders
            rule: unavailable
            status: 500
      - id: "1.4"
requests: []
