summary: Every new order is screened by Northwind Pay before stock is reserved; the screen's verdict is cached by order id for an hour.
features:
  - id: cap-ordering
    why: Placing an order is the feature that gains the screen.
flows:
  - id: forge-orders.place-order
    how: changed
    why: The screen runs between receiving the order and reserving stock.
  - id: forge-stock.reserve-stock
    how: read
    why: Reserving stock happens only after the screen passes.
gaps:
  - what: No call to Northwind Pay exists yet.
    why: The estate never talks to the fraud screen today.
questions:
  - question: Should an order the screen can't reach be refused, or placed and screened later?
    evidence: [openspec/changes/add-fraud-check/brief.md:9]
