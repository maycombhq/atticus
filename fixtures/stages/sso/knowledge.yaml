      section: Redirect URI
      text: "Set the redirect URI to /login/oauth2/code/forge-identity, as the setup page says."
      snapshot: 2026-10-20
      line: 5
  urls: []
- kind: Pattern
  schemaVersion: 2
  id: sso-token-claims
  status: current
  confidence: inferred
  evidence: [{ source: document, path: knowledge/snapshots/forge-wiki/2026-10-20/token-claims-standard.md, line: 5, side: document }]
  code: sso-token-claims
  name: SSO tokens carry the claims a service checks
  patternKind: standard
  patternStatus: to-review
  appliesWhen: A Forge service accepts Forge SSO tokens.
  rules:
    - "A service that accepts Forge SSO tokens refuses a token whose aud claim doesn't name the service."
    - "A service reads who the caller is from the sub and email claims, never from a request header."
  tags: []
  quote:
    source: forge-wiki
    page: token-claims-standard.md
    section: Required claims
    text: "A service that accepts Forge SSO tokens refuses a token whose aud claim doesn't name the service."
    snapshot: 2026-10-20
