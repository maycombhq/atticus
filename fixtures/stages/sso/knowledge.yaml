- kind: ProcessDefinition
  schemaVersion: 2
  id: sso-setup
  status: current
  confidence: inferred
  evidence:
    - { source: document, path: knowledge/snapshots/forge-wiki/2026-10-20/sso-setup.md, line: 6, side: document }
    - { source: document, path: knowledge/snapshots/forge-wiki/2026-10-20/sso-quickstart.md, line: 5, side: document }
  flags: ["conflict:sso-setup.md|sso-notes.md"]
  title: Set up SSO for a Forge service
  processKind: process
  appliesWhen: A Forge service adds single sign-on (SSO) with Forge Identity for its callers.
  inputs: []
  steps:
    - Register the service as a client in Forge Identity and note its client id.
    - Set the redirect URI to /login/oauth2/code/forge-identity.
    - Read the client secret from the Forge vault at start-up, never from a file in the repo.
    - Check the signature of every token against the Forge Identity keys before reading its claims.
  tags: []
