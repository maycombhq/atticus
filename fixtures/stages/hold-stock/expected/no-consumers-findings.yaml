# What the architecture stage's checks give drafts/no-consumers.yaml, as rule, target and
# whether it blocks, in order: each breaking change names the consumers the map knows, and the
# missing deploy order is a risk (not blocking, so drafts recorded before it keep passing). A
# consumer-missing target ends with the consumers left out (ADR 0203 A: what an acceptance covers).
- [delta.consumer-missing, "forge-stock.reserve-stock:forge-orders", true]
- [delta.consumer-missing, "forge-orders.place-order#2:forge-reports", true]
- [delta.no-deploy-order, deploy, false]
