# clean.yaml with its consumers listed, but a deploy order that puts forge-orders first: before
# the migration it needs, and before forge-stock, whose changed reservation it calls.
flows:
  - flow: forge-stock.reserve-stock
    repo: forge-stock
    change: modify
    why: The reservation becomes a hold that ends.
    consumers: [forge-orders]
    steps:
      - op: add
        after: 1
        kind: transform
        what: The reservation is made a hold, with its id and when it ends
        fields: { to: [holdId, expiresAt] }
      - op: change
        step: 2
        kind: respond
        what: 201 Created with the hold's id and when it ends
        fields: { returns: [holdId, expiresAt] }
  - flow: forge-orders.place-order
    repo: forge-orders
    change: modify
    why: The order keeps the hold's id, and counts large quantities.
    steps:
      - op: change
        step: 2
        kind: call-out
        what: The stock service holds the quantity and returns the hold's id
        fields: { sends: [sku, quantity], returns: [holdId] }
      - op: change
        step: 4
        kind: write
        what: The order is inserted with the hold's id
        store: { table: forge-orders-db.orders, columns: [sku, quantity, hold_id], types: { hold_id: VARCHAR(36), quantity: BIGINT }, classification: { hold_id: internal }, migration: V4__add_hold_id.sql, consumers: [forge-reports] }
        fields: { sends: [sku, quantity, holdId], as: { holdId: hold_id } }
deploy:
  - repo: forge-orders
  - repo: forge-orders
    migration: V4__add_hold_id.sql
  - repo: forge-stock
