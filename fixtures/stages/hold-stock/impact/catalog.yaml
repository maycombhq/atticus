# Added to the hold-stock scenario for a change's impact (V1): who calls forge-stock's
# POST /stock/reservations, and how each link was made. forge-orders calls it (an Interface read
# from code, as well as its spec flow's step 2); forge-mobile is joined to it by path only (the
# join guessed: nothing in forge-mobile's code names forge-stock), so it may break, not surely;
# forge-partner calls it through the gateway route gw-stock-v1, which forge-gateway holds, so
# the route is one to update. Invented, written by hand.
