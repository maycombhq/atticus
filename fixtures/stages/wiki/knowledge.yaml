  code: vendor-partner-gateway
  name: Vendor calls through the partner gateway
  patternKind: integration-pattern
  patternStatus: to-review
  appliesWhen: A service calls a vendor.
  rules:
    - "Calls to a vendor go through the partner gateway, never straight to the vendor's host."
