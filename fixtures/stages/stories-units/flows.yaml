      then: the page says the order isn't found
      evidence: [{ source: code, repo: forge-web, path: src/orders/OrderPage.tsx, line: 18 }]
  steps:
    - kind: entry
      what: OrderPage reads the order id from the route
      evidence: [{ source: code, repo: forge-web, path: src/orders/OrderPage.tsx, line: 10 }]
      refs: []
      data: { reads: [orderId] }
    - kind: call-out
      what: The page gets the order
      evidence: [{ source: code, repo: forge-web, path: src/api/orders.ts, line: 14 }]
      refs: []
      to: { component: forge-orders, entry: "GET /orders/{orderId}" }
      data: { sends: [orderId], returns: [id, status] }
    - kind: respond
      what: The page shows the order's status
      evidence: [{ source: code, repo: forge-web, path: src/orders/OrderPage.tsx, line: 30 }]
      refs: []
      data: { returns: [status] }
