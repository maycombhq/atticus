# Retired with the four questions (ADR 0124 addendum, Part 4). The critic must not raise these any
# more; each line says why. The golden tests check that none of them comes back.
retired:
  - id: b11-no-firewall-draft
    rule: constitution.snow-drafts-present
    artifact: snow.md
    why: Service-desk requests are a manual step now, and the constitution rule is retired. atticus plan drafts snow.md from the triggers the check read (the firewall rule for gw-northwind-v2 included, its unknown fields left empty and listed), and atticus release plan lists each draft as a request a person files. The critic no longer checks a hand-written snow.md.
  - id: b12-gateway-draft-incomplete
    rule: constitution.snow-drafts-present
    artifact: snow.md
    why: The same retirement. The gateway proxy request's empty Target field shows in atticus release plan as a missing required field of the request, for the person filing it.
  - id: r04-limit-error-state
    rule: ux-states-complete
    artifact: ux.md
    why: The UX lens is gone. The Ledger team's ux-states-complete rule is retired; a screen state the specs imply is one of the things the complete lens looks for under the change's other rules.
