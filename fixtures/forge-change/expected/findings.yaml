# Seeded problems in the add-transfer-limit change, and what the critic must report at the
# plan gate (round 1). Hand-written ground truth: never regenerate it from critic output.
#
# layer says which critic layer must catch the problem:
#   deterministic - layer 1, zero tokens. Everything that can be checked from files is here.
#   ai            - layer 2, a recorded AI lens answer (recordings/). Only judgement calls.
# A finding matches an entry when its rule, severity and kind match, and its artifact and
# line (or record) match when the entry gives them.
#
# Re-baselined for the critic's four questions (ADR 0124 addendum, Part 4, 2026-10-24): the seven
# role lenses became four question lenses (true, complete, safe, ship) and the constitution gained
# the code checks of the four questions. What retired is listed under retired, with why; every
# other seeded blocking issue is still caught, by the same layer. New entries say "(Part 4)".
#
# The product owner's decisions of 2026-10-24: the timeout and rollback checks moved from the
# constitution to the starter review (org layer, the organisation's to change), which the fixture's
# org pack carries (org-pack/checklists/review.yaml, named at the gates). r06, r07 and r08 are the
# same findings, by the same layer, from review.call-timeout-stated and review.store-write-rollback
# instead of constitution.*; the auth and breaking checks (g14) stay constitution rules.
change: add-transfer-limit
gate: plan

