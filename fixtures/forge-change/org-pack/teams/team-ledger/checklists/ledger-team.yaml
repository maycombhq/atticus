# The Ledger team's checklist (fixture). Contract C3, team layer: it applies to changes that
# touch a system team-ledger owns. A team pack may add rules or tighten others; it can never
# drop or loosen a constitution or org rule.
#
# Each rule's lens is the question it asks (ADR 0124 addendum, Part 4): true, complete, safe or
# ship. The fixture was re-baselined for the four questions: ux-states-complete is retired (its
# concern, a screen state the specs imply, is the complete lens's to read, and the rule is kept
# here as a record), and every other rule keeps what it checks.
schemaVersion: 1
name: ledger-team
version: 0.1.0
description: What the Ledger team checks on top of the constitution and the Forge org pack.
rules:
  - id: vendor-rate-limit-known
    title: The vendor's rate limit is known
    layer: team
    lens: ship
    appliesTo: { artifacts: [interfaces, catalog] }
    severity: risk
    check:
      type: deterministic
      check: fact-known
      params:
        kind: Setting
        where: { settingKind: rate-limit }
        scope: touched-vendors
        question: "What rate limit does ${record} put on our calls, and what happens when we pass it?"
    waivable: false
    source: Ledger team practice
    needs:
      - kind: Setting
        field: settingKind
        scope: touched-systems
        question: "What rate limit does ${record} put on our calls, and what happens when we pass it?"

  - id: vendor-contact-known
    title: There is a named contact at each vendor
    layer: team
    lens: ship
    appliesTo: { artifacts: [interfaces, catalog] }
    severity: risk
    check:
      type: deterministic
      check: fact-known
      params:
        kind: Party
        scope: touched-vendors
        question: "Who is our contact at ${record} for API changes, and how do we reach them?"
    waivable: false
    source: Ledger team practice
    needs:
      - kind: Party
        scope: touched-systems
        question: "Who is our contact at ${record} for API changes, and how do we reach them?"

  - id: vendor-operation-known
    title: Vendor operations exist in the vendor's published spec
    layer: team
    lens: "true"
    appliesTo: { artifacts: [interfaces, catalog] }
    severity: risk
    check:
      type: deterministic
      check: vendor-operation-known
    waivable: false
    source: Ledger team practice
    needs:
      - kind: Endpoint
        scope: touched-systems
        question: "Where is the published API spec for ${record}?"

  - id: slo-known
    title: Touched products have a latency SLO
    layer: team
    lens: ship
    appliesTo: { artifacts: [design, catalog] }
    severity: risk
    check:
      type: deterministic
      check: fact-known
      params:
        kind: Obligation
        where: { obligationKind: slo }
        scope: touched-systems
        boundary: [product]
        question: "What latency SLO does ${record} promise its callers?"
    waivable: false
    source: Ledger team practice
    needs:
      - kind: Obligation
        scope: touched-systems
        question: "What latency SLO does ${record} promise its callers?"

  - id: capacity-known
    title: Touched data stores have a known daily volume
    layer: team
    lens: ship
    appliesTo: { artifacts: [data, catalog] }
    severity: risk
    check:
      type: deterministic
      check: fact-known
      params:
        kind: Obligation
        where: { obligationKind: volume }
        scope: touched-data-stores
        question: "How many writes a day does ${record} take at peak?"
    waivable: false
    source: Ledger team practice
    needs:
      - kind: Obligation
        scope: touched-data-stores
        question: "How many writes a day does ${record} take at peak?"

  - id: mappings-cover-interfaces
    title: Every new or changed interface has a mapping
    layer: team
    lens: complete
    appliesTo: { artifacts: [interfaces, mappings] }
    severity: risk
    check:
      type: deterministic
      check: mappings-cover-interfaces
    waivable: false
    source: Ledger team practice

  - id: tasks-cover-stories
    title: Every story has tasks in each repo it lists
    layer: team
    lens: complete
    appliesTo: { artifacts: [stories, tasks] }
    severity: risk
    check:
      type: deterministic
      check: tasks-cover-stories
    waivable: false
    source: Ledger team practice

  - id: design-concurrency-handled
    title: The design says how concurrent requests are serialised
    layer: team
    lens: safe
    appliesTo: { artifacts: [design] }
    severity: blocking
    check:
      type: ai
      prompt: Read the design. Report a finding when two requests for the same account can run at the same time and the design does not say how they are serialised (a row lock, a unique constraint, an idempotency key or a queue). Quote the passage that shows the gap.
    waivable: true
    source: Ledger incident review, two transfers passing one balance check

  - id: brief-questions-answered
    title: Open questions and partner failures are answered before planning
    layer: team
    lens: complete
    appliesTo: { artifacts: [brief, proposal, specs] }
    severity: blocking
    check:
      type: ai
      prompt: Compare the brief's and the proposal's open questions with the specs. For each question the specs don't answer, and for each partner call whose failure behaviour the specs don't describe, raise a knowledge gap with the question and who should answer it. Quote the line you relied on.
    waivable: true
    source: Ledger team practice

  - id: story-traces-to-spec
    title: Every story traces to a spec requirement
    layer: team
    lens: complete
    appliesTo: { artifacts: [stories, specs] }
    severity: blocking
    check:
      type: ai
      prompt: For each story, find the spec requirement and scenario its acceptance criteria come from. Report a finding for a story whose behaviour no requirement describes; it is either missing from the specs or not in scope. Quote the story line and name the requirement you looked for.
    waivable: true
    source: Definition of ready

  - id: ux-states-complete
    title: The UX covers loading, empty and error states
    layer: team
    lens: complete
    appliesTo: { artifacts: [ux, specs] }
    severity: risk
    check:
      type: ai
      prompt: Read the UX notes against the specs. Report a finding for each screen state the specs imply but the UX doesn't describe, such as an error when data can't be loaded or a partner doesn't answer. Quote the UX line nearest the missing state.
    waivable: false
    source: Ledger team practice
    # Retired with the four questions (ADR 0124 addendum, Part 4): the UX lens is gone, and a screen
    # state the specs imply is one of the things the complete lens looks for.
    status: retired

  - id: tasks-sequenced-for-lead-times
    title: Tasks start service-desk requests early enough
    layer: team
    lens: ship
    appliesTo: { artifacts: [tasks, snow] }
    severity: risk
    check:
      type: ai
      prompt: Compare the tasks with the service-desk requests and their lead times. Report a finding when a task depends on a request that no earlier task raises, or when the lead time would hold up the build. Quote the task.
    waivable: false
    source: Ledger team practice

  - id: tests-cover-scenarios
    title: Tests cover every spec scenario
    layer: team
    # The spec hand-up reviews code and tests with the code-and-test lens's agent (packages/speckit);
    # at the gates this rule asks the complete question.
    lens: code-and-test
    question: complete
    appliesTo: { artifacts: [code, tests] }
    severity: risk
    check:
      type: ai
      prompt: For each spec scenario, find the test that covers it. Report a finding for each scenario with no test, quoting the scenario.
    waivable: false
    source: Ledger team practice

  - id: release-plan-complete
    title: The release plan names its checks and its fallback
    layer: team
    lens: ship
    appliesTo: { artifacts: [release, snow] }
    severity: risk
    check:
      type: ai
      prompt: Read the release notes and service-desk requests. Report a finding when the release has no smoke check after deployment or no fallback if a request is not done in time. Quote the passage you relied on.
    waivable: false
    source: Ledger team practice
