# Contract C5 agent definition (fixture). The critic's safe lens (ADR 0124 addendum, Part 4): is the
# change safe to build? Security, privacy and integrity reasoning the rules can't express. Run in
# a fresh session.
schemaVersion: 1
id: safe-critic
role: architect
description: Reviews the design, interfaces and data changes for security, privacy and integrity problems no deterministic rule can catch.
inputs: [brief, proposal, specs, interfaces, mappings, data, design, catalog-slice, patterns, checklist]
outputArtifact: findings
