  evidence:
    - source: document
      path: knowledge/snapshots/ea-standards/2026-10-20/Standards/Database-Schema-Changes.md
      line: 14
      side: document
  code: schema-migrations
  name: Schema changes are Flyway migrations
  patternKind: standard
  patternStatus: to-review
  appliesWhen: A change adds or changes a table.
  rules:
    - A schema change to a Forge database is a Flyway migration in the repo of the service that owns the table.
    - A migration that adds a table also adds its primary key and the indexes its queries need.
    - A migration is never edited once it has run in production.
  tags: []
  quote:
    source: ea-standards
    page: Standards/Database-Schema-Changes.md
    section: Migrations
    text: A schema change to a Forge database is a Flyway migration in the repo of the service that owns the table.
