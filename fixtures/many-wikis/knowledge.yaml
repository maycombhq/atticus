  id: error-response-format
  status: current
  confidence: inferred
  evidence:
    - source: document
      path: knowledge/snapshots/ea-standards/2026-10-20/Standards/Error-Response-Format.md
      line: 14
      side: document
  code: error-response-format
  name: Error response format
  patternKind: standard
  patternStatus: to-review
  appliesWhen: A REST endpoint answers an error.
  rules:
    - Every REST endpoint answers an error with an application/problem+json body.
    - The body has the fields type, title, status and detail, and nothing else at the top level.
    - The status field repeats the HTTP status code.
    - The detail field never carries a stack trace or an internal class name.
  tags: []
  quote:
    source: ea-standards
    page: Standards/Error-Response-Format.md
    section: The error body
    text: Every REST endpoint answers an error with an application/problem+json body.
    snapshot: 2026-10-20
    line: 14
