  title: Replay a failed refund
  processKind: process
  appliesWhen: A refund failed and is retried.
  inputs: []
  steps:
    - Find the failed refund in the refunds dead-letter queue by its refund id.
    - "Check the payment in forge-payments: a refund already paid is not replayed."
    - Put the refund back on the refunds queue with its original idempotency key.
  tags: []
