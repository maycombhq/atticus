  code: payments-api-conventions
  name: Refund requests in the payments API
  patternKind: standard
  patternStatus: to-review
  appliesWhen: A client creates a refund in forge-payments.
  rules:
    - A refund is created with POST /payments/{paymentId}/refunds and answers 201 with the refund's id.
