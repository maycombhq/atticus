  code: event-principles
  name: Services tell each other what happened through events
  patternKind: integration-pattern
  patternStatus: to-review
  rules:
    - Services tell each other what happened through events rather than calls, so a slow consumer never slows the producer.
    - An event names something that happened, in the past tense, and carries what a consumer needs to act on it.
  tags: []
  quote:
    source: ea-standards
