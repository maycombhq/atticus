  id: api-resource-naming
  status: current
  confidence: inferred
  evidence:
    - source: document
      path: knowledge/snapshots/ea-standards/2026-10-20/Standards/API-Design-Standard.md
      line: 14
      side: document
  code: api-resource-naming
  name: REST endpoints name resources
  patternKind: standard
  patternStatus: to-review
  appliesWhen: A service adds or changes a REST endpoint.
  rules:
    - A REST endpoint names a resource with a plural noun, such as /orders or /refunds.
    - "An action on one resource is a sub-resource: POST /orders/{orderId}/refunds, never POST /refundOrder."
    - Path parameters are written in camel case, such as {orderId}.
  tags: []
