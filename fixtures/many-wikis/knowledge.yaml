  code: idempotency-keys
  name: Idempotency keys
  patternKind: standard
  patternStatus: to-review
  appliesWhen: A service changes a payment or a refund.
  rules:
    - A service that moves money accepts an Idempotency-Key header on every request that changes a payment or a refund.
    - The service keeps each idempotency key for 24 hours.
    - A request repeated with the same key returns the first answer and changes nothing.
  tags: []
  quote:
    source: ea-standards
    page: Standards/Idempotency-Keys.md
    section: Keeping the key
    text: A service that moves money accepts an Idempotency-Key header on every request that changes a payment or a refund.
