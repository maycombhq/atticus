schemaVersion: 1
enabledOptional: [data-architect, sre]
mappings:
  - { group: "Forge Architects", role: architect }
  - { group: "Forge Ledger Team", role: developer }
  - { group: "Forge Platform", role: platform-lead }
approvals:
  release-go-no-go: { roles: [delivery-lead] }
  waiver: { roles: [architect], groups: ["Forge Architects"] }
  snow-submission: { roles: [delivery-lead] }
  org-pack-change: { roles: [platform-lead] }
separation:
  - actions: ["author:design", "approve:design"]
    reason: The author of a design can't approve it.
