# Default values for forge-rates.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: registry.forge.example/forge/rates
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: rates.forge.example
      paths:
        - path: /rates
          pathType: Prefix
  tls: []

database:
  user: rates
  password: ""
  apiKey: "changeme"
