apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-rates
  namespace: rates
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-rates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-rates
    spec:
      containers:
      - name: forge-rates
        image: registry.forge.example/forge/rates:0.4.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: RATES_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: forge-rates-db
              key: password
        - name: NORTHWIND_CLIENT_SECRET
          value: "nw-live-0c9d8e7f6a5b4c3d2e1f"
