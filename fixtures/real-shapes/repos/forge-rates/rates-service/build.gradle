plugins {
    id 'org.springframework.boot'
    id 'checkstyle'
}

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
}

ext.checkstyleVersion = "12.3.1"

dependencies {
    implementation project(':rates-core')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "forge.ledger:ledger-api:1.2.0"
    implementation(platform("forge.platform:forge-platform-bom:2.0.0"))
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation group: 'com.northwind.pay', name: 'northwind-pay-client', version: '4.2.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'org.testcontainers:postgresql'
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
}
