# Invented Forge repos (see fixtures/reconnect/README.md): forge-orders calls forge-billing by
# every way a call can be joined, and each of those calls really goes to forge-ledger.
schemaVersion: 3
platform: forge
repos:
  - id: forge-orders
    url: https://git.forge.example/forge/forge-orders.git
    type: spring-boot
    owner: team-orders
  - id: forge-billing
    url: https://git.forge.example/forge/forge-billing.git
    type: spring-boot
    owner: team-billing
    hosts: [billing.forge.example]
  - id: forge-ledger
    url: https://git.forge.example/forge/forge-ledger.git
    type: spring-boot
    owner: team-ledger
    hosts: [ledger.forge.example]
  - id: forge_billing_1-0
    url: https://git.forge.example/forge/forge_billing_1-0.git
    type: gateway
    owner: team-platform
    component: billing-proxy
    system: platform
    hosts: [gw.forge.example]
