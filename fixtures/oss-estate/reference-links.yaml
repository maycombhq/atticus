# The true arrows of the public estate (README.md), written by hand from the two repos' source
# at the pinned commits: every HTTP call the Angular app's services make, each to the REST API's
# entry it reaches. `at` is the call's line in spring-petclinic-angular; `note` names the entry
# of spring-petclinic-rest (method and path as its openapi.yml declares it under
# /petclinic/api, and the line of its path key, which every method on that path shares), then
# the id the catalog gives that entry's Endpoint record. oss-estate-join.test.ts checks each
# drawn Interface's `endpoint` against that id, and the Endpoint record's method and path
# against the entry written here. The format is the one `atticus measure links` reads
# (docs/guide/measure.md).
