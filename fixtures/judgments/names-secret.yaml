# Names-secret cases (ADR 0117 addendum): does a line of the change say a secret or credential is
# needed or touched? `truth` is what a security reviewer says. The new rule settles a line that
# holds a token in a known format (a fact: the shape is on the line) and asks the judge of the
# rest; `recorded` is the judge's recorded answer. The old rule (the security review's
# SECRET_WORDS regex) is scored on the same lines.
cases:
  - id: shared-key-hash
    line: "account.account_number → accountRef: hashed with the shared key; refuse the transfer"
    truth: yes
    recorded: { verdict: yes, quotes: [{ of: line, text: hashed with the shared key }] }
  - id: key-in-a-vault
    line: Rotate the Northwind Pay key in the vault every 90 days.
    truth: yes
    recorded: { verdict: yes, quotes: [{ of: line, text: Rotate the Northwind Pay key }] }
  - id: token-bucket
    line: The gateway limits each client with a token bucket of 50 requests a second.
    truth: no
    recorded: { verdict: no, quotes: [{ of: line, text: a token bucket of 50 requests a second }] }
  - id: password-reset-link
    line: The limit page links to the password reset page, which this change doesn't alter.
    truth: no
    recorded: { verdict: no, quotes: [{ of: line, text: which this change doesn't alter }] }
  - id: certificate-of-deposit
    line: Accounts of type certificate of deposit have no daily limit.
    truth: no
    recorded: { verdict: no, quotes: [{ of: line, text: Accounts of type certificate of deposit }] }
  - id: hmac-signing-paraphrase
    line: ledger-api signs each request to Northwind Pay with an HMAC, using a key Northwind Pay issues.
    truth: yes
    recorded: { verdict: yes, quotes: [{ of: line, text: using a key Northwind Pay issues }] }
  - id: client-secret-identifier
    line: portal-bff reads its client_secret from the environment at start-up.
    truth: yes
    recorded: { verdict: yes, quotes: [{ of: line, text: reads its client_secret }] }
  - id: access-key-in-the-text
    line: Use the sandbox access key AKIAABCDEFGHIJKLMNOP for the contract tests.
    truth: yes
  - id: primary-key
    line: id bigint is the primary key of limit_change.
    truth: no
    recorded: { verdict: no, quotes: [{ of: line, text: the primary key of limit_change }] }
  - id: plain-approach
    line: The Portal shows how much of today's limit is left.
    truth: no
    recorded: { verdict: no, quotes: [{ of: line, text: how much of today's limit is left }] }
